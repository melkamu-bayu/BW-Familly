# Render Blueprint (https://render.com/docs/blueprint-spec)
#
# This file MUST live at the repo root -- Render's Blueprint scanner only
# looks there, even though the actual service code lives in the
# assetflow-backend/ subfolder. `rootDir` below tells Render to build and
# deploy from that subfolder (this is a monorepo, since assetflow_mobile/
# lives alongside it).
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo.
#
# NOTE ON REDIS: Render's free tier does not include a managed Redis/key-value
# service by default. The backend's rate limiter (core/rate_limit.py) is
# deliberately fail-open -- if it can't reach Redis, it lets requests through
# instead of blocking the API -- so the app runs correctly without Redis at
# all. Leave REDIS_URL unset for the free tier; add a Redis/Key Value
# instance later from the Render dashboard if you want real rate-limiting
# enforced, then set REDIS_URL to point at it.

databases:
  - name: assetflow-db
    plan: free
    databaseName: assetflow
    user: assetflow

services:
  - type: web
    name: assetflow-api
    runtime: docker
    plan: free
    rootDir: assetflow-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assetflow-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["*"]'
      # REDIS_URL intentionally omitted -- see note above. The rate limiter
      # fails open without it, so the API works fine; add it later if needed.
