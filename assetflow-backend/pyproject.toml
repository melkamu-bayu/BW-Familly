[project]
name = "assetflow-api"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.0",
    "sqlalchemy==2.0.51",
    "pg8000",
    "pydantic==2.14.2",
    "pydantic-settings==2.5.2",
    "python-jose==3.3.0",
    "passlib[argon2]==1.7.4",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
    "python-dotenv==1.0.1",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
