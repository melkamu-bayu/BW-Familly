name: AssetFlow - Fix All Child Page Back Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-buttons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Verify project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/models/models.dart
          test -f lib/router.dart
          test -f lib/widgets/nav_shell.dart
          test -f lib/screens/dashboard/dashboard_screen.dart
          test -f lib/screens/vehicles/vehicle_detail_screen.dart
          test -f lib/screens/properties/property_detail_screen.dart

          grep -q "go_router:" pubspec.yaml
          grep -q "/vehicles/:id" lib/router.dart
          grep -q "/properties/:id" lib/router.dart

          echo "Project verification passed."

      - name: Flutter pub get
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      # ==========================================================
      # Vehicle model
      # ==========================================================
      - name: Verify Vehicle model compatibility
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/models/models.dart"

          grep -q "currentValue" "$FILE" || {
            echo "ERROR: currentValue is missing from Vehicle model."
            exit 1
          }

          grep -q "purchasePrice" "$FILE" || {
            echo "ERROR: purchasePrice is missing from Vehicle model."
            exit 1
          }

          grep -q "current_value" "$FILE" || {
            echo "ERROR: current_value JSON mapping is missing."
            exit 1
          }

          grep -q "purchase_price" "$FILE" || {
            echo "ERROR: purchase_price JSON mapping is missing."
            exit 1
          }

          echo "Vehicle model is already compatible."

      # ==========================================================
      # Vehicle detail back button
      # ==========================================================
      - name: Fix Vehicle detail back button
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/screens/vehicles/vehicle_detail_screen.dart"

          grep -q "package:go_router/go_router.dart" "$FILE" || \
            sed -i "1i import 'package:go_router/go_router.dart';" "$FILE"

          if ! grep -q "tooltip: 'Back'" "$FILE"; then

            python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = "appBar: AppBar("

          new = """appBar: AppBar(
                leading: IconButton(
                  icon: const Icon(Icons.arrow_back_rounded),
                  tooltip: 'Back',
                  onPressed: () {
                    if (context.canPop()) {
                      context.pop();
                    } else {
                      context.go('/vehicles');
                    }
                  },
                ),"""

          if old not in text:
              raise SystemExit("Vehicle detail AppBar not found.")

          text = text.replace(old, new, 1)
          path.write_text(text)

          print("Vehicle detail back button added.")
          PY

          else
            echo "Vehicle detail already has Back button."
          fi

      # ==========================================================
      # Property detail back button
      # ==========================================================
      - name: Fix Property detail back button
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/screens/properties/property_detail_screen.dart"

          grep -q "package:go_router/go_router.dart" "$FILE" || \
            sed -i "1i import 'package:go_router/go_router.dart';" "$FILE"

          if ! grep -q "tooltip: 'Back'" "$FILE"; then

            python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = "appBar: AppBar("

          new = """appBar: AppBar(
                leading: IconButton(
                  icon: const Icon(Icons.arrow_back_rounded),
                  tooltip: 'Back',
                  onPressed: () {
                    if (context.canPop()) {
                      context.pop();
                    } else {
                      context.go('/properties');
                    }
                  },
                ),"""

          if old not in text:
              raise SystemExit("Property detail AppBar not found.")

          text = text.replace(old, new, 1)
          path.write_text(text)

          print("Property detail back button added.")
          PY

          else
            echo "Property detail already has Back button."
          fi

      # ==========================================================
      # Format
      # ==========================================================
      - name: Format modified Dart files
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            lib/models/models.dart \
            lib/screens/vehicles/vehicle_detail_screen.dart \
            lib/screens/properties/property_detail_screen.dart

      # ==========================================================
      # Verify navigation code
      # ==========================================================
      - name: Verify back navigation
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          VEHICLE="lib/screens/vehicles/vehicle_detail_screen.dart"
          PROPERTY="lib/screens/properties/property_detail_screen.dart"

          grep -q "tooltip: 'Back'" "$VEHICLE"
          grep -q "context.canPop()" "$VEHICLE"
          grep -q "context.pop()" "$VEHICLE"
          grep -q "context.go('/vehicles')" "$VEHICLE"

          grep -q "tooltip: 'Back'" "$PROPERTY"
          grep -q "context.canPop()" "$PROPERTY"
          grep -q "context.pop()" "$PROPERTY"
          grep -q "context.go('/properties')" "$PROPERTY"

          echo "Vehicle detail navigation verified."
          echo "Property detail navigation verified."

      # ==========================================================
      # Make sure router/NavShell weren't modified
      # ==========================================================
      - name: Protect navigation architecture
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only | grep -E \
            '^assetflow_mobile/lib/(router|widgets/nav_shell)\.dart$'
          then
            echo "ERROR: Router or NavShell was modified."
            exit 1
          fi

          echo "Router and NavShell remain unchanged."

      # ==========================================================
      # Analyzer
      #
      # Existing warnings/info are allowed.
      # Actual analyzer errors remain fatal.
      # ==========================================================
      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-fatal-warnings

          echo "Flutter analyze completed successfully."

      # ==========================================================
      # Android
      # ==========================================================
      - name: Ensure Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "Android directory missing. Creating it."

            flutter create \
              --platforms=android \
              --project-name=assetflow_mobile \
              .
          fi

          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project verified."

      # ==========================================================
      # Internet permission
      # ==========================================================
      - name: Ensure INTERNET permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$FILE"; then
            sed -i '/<application/i\
    <uses-permission android:name="android.permission.INTERNET"/>' "$FILE"
          fi

          grep -q "android.permission.INTERNET" "$FILE"

          echo "INTERNET permission verified."

      # ==========================================================
      # Final analyzer
      # ==========================================================
      - name: Final Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-fatal-warnings

          echo "Final analyzer passed."

      # ==========================================================
      # Build APK
      # ==========================================================
      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK build successful."

      # ==========================================================
      # Final safety check
      # ==========================================================
      - name: Final safety check
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only | grep -E \
            '^assetflow_mobile/lib/(router|widgets/nav_shell)\.dart$'
          then
            echo "ERROR: Protected navigation file changed."
            exit 1
          fi

          echo "Final safety check passed."

      # ==========================================================
      # Commit
      # ==========================================================
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assetflow_mobile/lib/models/models.dart \
            assetflow_mobile/lib/screens/vehicles/vehicle_detail_screen.dart \
            assetflow_mobile/lib/screens/properties/property_detail_screen.dart \
            assetflow_mobile/android

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Fix child page back navigation"
          git push origin master

      # ==========================================================
      # APK artifact
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
