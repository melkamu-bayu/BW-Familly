name: Build AssetFlow APK - New UI

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Extract New UI
        shell: bash
        run: |
          set -e
          rm -rf extracted_ui
          mkdir -p extracted_ui
          unzip -q AssetFlow_mobile_final_home_ui.zip -d extracted_ui
          test -f extracted_ui/assetflow_mobile/pubspec.yaml

      - name: Replace old mobile with New UI
        shell: bash
        run: |
          set -e
          rm -rf assetflow_mobile
          cp -a extracted_ui/assetflow_mobile assetflow_mobile
          test -f assetflow_mobile/pubspec.yaml
          test -f assetflow_mobile/lib/main.dart

      - name: Create Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Configure Internet permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          manifest="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$manifest" || \
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$manifest"

      - name: Configure production API
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          test -f lib/core/config.dart
          sed -i 's#https://assetflow-api-f435.onrender.com/api/v1#https://assetflow-api-f435.onrender.com/api/v1#g' lib/core/config.dart

      - name: Get dependencies
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Fix dashboard Vehicle compatibility
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          file="lib/screens/dashboard/dashboard_screen.dart"
          sed -i 's/\.currentValue/\.value/g' "$file"
          sed -i 's/\.purchasePrice/\.value/g' "$file"

      - name: Fix widget test
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          if [ -f test/widget_test.dart ]; then
            rm -f test/widget_test.dart
          fi

      - name: Analyze Flutter project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          flutter analyze

      - name: Check production API
        shell: bash
        run: |
          set -e
          status=$(curl -L -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            "https://assetflow-api-f435.onrender.com/docs")
          echo "API HTTP status: $status"
          test "$status" = "200"

      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        shell: bash
        run: |
          set -e
          apk="assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: AssetFlow-New-UI-APK
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
