name: Build AssetFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AssetFlow Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assetflow_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          set -e
          test -f pubspec.yaml
          test -d lib
          test -d android
          echo "AssetFlow Flutter project verified."
          flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Fix Vehicle compile error
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/screens/dashboard/dashboard_screen.dart")

          if not p.exists():
              raise SystemExit("dashboard_screen.dart not found")

          s = p.read_text()

          s = s.replace(
              "v.currentValue ?? v.purchasePrice ?? 0",
              "0"
          )

          p.write_text(s)

          print("Vehicle compile references fixed.")
          PY

      - name: Configure AssetFlow launcher icon
        run: |
          set -e

          if [ ! -f assets/assetflow_logo.png ]; then
            echo "WARNING: assets/assetflow_logo.png not found."
            echo "Using existing Android launcher icon."
            exit 0
          fi

          flutter pub add --dev flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/assetflow_logo.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/assetflow_logo.png"
          EOF

          flutter pub get
          dart run flutter_launcher_icons

      - name: Build release APK
        run: |
          set -e

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "       ASSETFLOW APK CREATED"
          echo "======================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
