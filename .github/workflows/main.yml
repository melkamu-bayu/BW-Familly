name: AssetFlow - Fix All Child Page Back Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-buttons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: assetflow_mobile
        shell: bash
        run: flutter pub get

      - name: Fix all child page back buttons
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          changed=0

          while IFS= read -r -d '' file; do

            # Skip navigation shell and root/navigation infrastructure.
            case "$file" in
              lib/widgets/nav_shell.dart)
                continue
                ;;
              lib/router.dart)
                continue
                ;;
            esac

            # Only process screens containing an AppBar.
            if ! grep -q 'appBar: AppBar(' "$file"; then
              continue
            fi

            # Do not add a second back button.
            if grep -q 'leading:' "$file"; then
              continue
            fi

            # Add go_router import if needed.
            if ! grep -q "package:go_router/go_router.dart" "$file"; then
              sed -i "1i import 'package:go_router/go_router.dart';" "$file"
            fi

            # Add a normal back button to the AppBar.
            sed -i '/appBar: AppBar(/a\
        leading: const BackButton(),' "$file"

            changed=$((changed + 1))

          done < <(find lib/screens -type f -name '*.dart' -print0)

          echo "Child page files modified: $changed"

          if [ "$changed" -eq 0 ]; then
            echo "No child pages required modification."
          fi

      - name: Format Dart
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/screens

      - name: Verify back buttons
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          count=$(grep -R -l \
            'leading: const BackButton()' \
            lib/screens \
            --include='*.dart' | wc -l)

          echo "Child pages with BackButton: $count"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No child page BackButton was found."
            exit 1
          fi

      - name: Verify protected navigation files
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only | grep -E \
            '^assetflow_mobile/lib/(router|widgets/nav_shell)\.dart$'
          then
            echo "ERROR: router.dart or nav_shell.dart was modified."
            exit 1
          fi

          echo "Protected navigation files are unchanged."

      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-fatal-warnings

          echo "Flutter analyzer completed successfully."

      - name: Ensure Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          test -f android/app/src/main/AndroidManifest.xml

      - name: Ensure INTERNET permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          manifest="android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<application/i\
    <uses-permission android:name="android.permission.INTERNET"/>' "$manifest"
          fi

          grep -q 'android.permission.INTERNET' "$manifest"

      - name: Final Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-fatal-warnings

          echo "Final analyzer passed."

      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "Release APK built successfully."

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/lib/screens
          git add assetflow_mobile/android

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix back buttons on all child pages"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
