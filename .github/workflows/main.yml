name: Build AssetFlow APK - New UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Find new UI ZIP
        shell: bash
        run: |
          set -e

          ZIP='AssetFlow_mobile_final_home_ui.zip'

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in repository root."
            ls -la
            exit 1
          fi

          echo "Found: $ZIP"

      - name: Backup current app
        shell: bash
        run: |
          set -e

          rm -rf assetflow_mobile_backup

          if [ -d assetflow_mobile ]; then
            cp -a assetflow_mobile assetflow_mobile_backup
            echo "Existing application backed up."
          else
            echo "No existing assetflow_mobile directory."
          fi

      - name: Extract new UI ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_ui
          mkdir -p extracted_ui

          unzip -q AssetFlow_mobile_final_home_ui.zip -d extracted_ui

          PROJECT='extracted_ui/assetflow_mobile'

          if [ ! -f "$PROJECT/pubspec.yaml" ]; then
            echo "ERROR: Flutter project was not found inside ZIP."
            find extracted_ui -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "UI extracted to:"
          echo "$PROJECT"

      - name: Replace current app with new UI
        shell: bash
        run: |
          set -e

          rm -rf assetflow_mobile

          cp -a extracted_ui/assetflow_mobile assetflow_mobile

          test -f assetflow_mobile/pubspec.yaml
          test -f assetflow_mobile/lib/main.dart

          echo "New UI copied to assetflow_mobile."

      - name: Create Android platform files if missing
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Android directory missing."
            echo "Creating Android project..."

            flutter create --platforms=android .
          fi

          test -d android
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project ready."

      - name: Configure Internet permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          MANIFEST='android/app/src/main/AndroidManifest.xml'

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          grep -q 'android.permission.INTERNET' "$MANIFEST"

          echo "Internet permission confirmed."

      - name: Check production API configuration
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          CONFIG='lib/core/config.dart'

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found."
            exit 1
          fi

          echo "Production API will be supplied during APK build."

          grep -n 'API_BASE_URL' "$CONFIG" || true

      - name: Install Flutter dependencies
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          flutter pub get

      - name: Check required source files
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          test -f lib/main.dart
          test -f lib/models/models.dart
          test -f lib/screens/dashboard/dashboard_screen.dart

          echo "Required source files are present."

      - name: Run Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          flutter analyze

      - name: Check production API availability
        shell: bash
        run: |
          set -e

          URL='https://assetflow-api-f435.onrender.com/docs'

          STATUS=$(curl \
            -L \
            -s \
            -o /dev/null \
            -w '%{http_code}' \
            --connect-timeout 15 \
            --max-time 30 \
            "$URL")

          echo "Production API docs HTTP status: $STATUS"

          if [ "$STATUS" != '200' ]; then
            echo "ERROR: Production API is not reachable."
            exit 1
          fi

      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK='assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk'

          test -f "$APK"

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: AssetFlow-New-UI-Release-APK
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload old app backup
        if: ${{ hashFiles('assetflow_mobile_backup/pubspec.yaml') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: AssetFlow-Old-App-Backup
          path: assetflow_mobile_backup
          if-no-files-found: error
