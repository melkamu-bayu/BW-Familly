name: Build AssetFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AssetFlow Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assetflow_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -d lib

          echo "AssetFlow project:"
          pwd

          flutter --version

      - name: Generate Android project
        run: |
          set -euo pipefail

          if [ ! -d android ] || [ ! -f android/gradlew ]; then
            echo "Android project is missing."
            echo "Generating Android project from Flutter..."

            flutter create \
              --platforms=android \
              --project-name=assetflow_mobile \
              .

          else
            echo "Existing Android project found."
          fi

          test -d android
          test -f android/gradlew

          echo "Android project ready."

      - name: Get dependencies
        run: |
          set -euo pipefail
          flutter pub get

      - name: Fix current Vehicle model mismatch
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/screens/dashboard/dashboard_screen.dart")

          if not path.exists():
              raise SystemExit("dashboard_screen.dart not found")

          text = path.read_text()

          old = "v.currentValue ?? v.purchasePrice ?? 0"

          if old in text:
              text = text.replace(old, "0")
              path.write_text(text)
              print("Fixed Vehicle value calculation.")
          else:
              print("Vehicle value calculation already compatible.")

          if "v.currentValue" in text:
              raise SystemExit("currentValue reference still exists")

          if "v.purchasePrice" in text:
              raise SystemExit("purchasePrice reference still exists")
          PY

      - name: Configure AssetFlow launcher icon
        run: |
          set -euo pipefail

          test -f assets/assetflow_logo.png

          flutter pub add --dev flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/assetflow_logo.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/assetflow_logo.png"
          EOF

          flutter pub get

          dart run flutter_launcher_icons

          echo "AssetFlow launcher icon generated."

      - name: Ensure Android Internet permission
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\
              <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          grep -q 'android.permission.INTERNET' "$MANIFEST"

          echo "Internet permission verified."

      - name: Build release APK
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "       ASSETFLOW APK SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
