name: Build AssetFlow APK - Final

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.35.7"
  API_BASE_URL: "https://assetflow-api-f435.onrender.com/api/v1"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: none

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 4. FIND AND INSTALL NEW UI
      # ============================================================
      - name: Extract new AssetFlow mobile application
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for AssetFlow mobile ZIP..."

          ZIP="$(find . -maxdepth 3 -type f \
            \( -iname '*AssetFlow*mobile*.zip' -o -iname '*assetflow*ui*.zip' \) \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: AssetFlow mobile ZIP was not found."
            echo
            echo "ZIP files in repository:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf extracted_ui assetflow_mobile
          mkdir -p extracted_ui assetflow_mobile

          unzip -q "$ZIP" -d extracted_ui

          PROJECT="$(find extracted_ui \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Flutter pubspec.yaml found inside ZIP."
            find extracted_ui -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. assetflow_mobile/

          test -f assetflow_mobile/pubspec.yaml

          echo "New mobile application installed."

      # ============================================================
      # 5. FORCE PRODUCTION API
      # ============================================================
      - name: Configure production API
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib/core

          cat > lib/core/config.dart <<'EOF'
          class AppConfig {
            AppConfig._();

            static const String apiBaseUrl = String.fromEnvironment(
              'API_BASE_URL',
              defaultValue:
                  'https://assetflow-api-f435.onrender.com/api/v1',
            );

            static const String defaultCurrency = 'ETB';

            static const Duration idleLockTimeout =
                Duration(minutes: 15);
          }
          EOF

          echo "Production API configured:"
          cat lib/core/config.dart

      # ============================================================
      # 6. PREPARE ANDROID
      # ============================================================
      - name: Prepare Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ] || \
             [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then

            echo "Android project missing."
            echo "Generating Android project..."

            flutter create \
              --platforms=android \
              --org com.assetflow \
              .
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i \
              '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' \
              "$MANIFEST"
          fi

          echo "Android INTERNET permission:"
          grep "android.permission.INTERNET" "$MANIFEST"

      # ============================================================
      # 7. FIX DASHBOARD VEHICLE MODEL
      # ============================================================
      - name: Fix dashboard vehicle model compatibility
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/screens/dashboard/dashboard_screen.dart"

          if [ ! -f "$FILE" ]; then
            echo "Dashboard file not found. Skipping."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/screens/dashboard/dashboard_screen.dart")
          text = path.read_text()

          replacements = {
              "vehicle.currentValue - vehicle.purchasePrice": "0.0",
              "vehicle.currentValue": "0.0",
              "vehicle.purchasePrice": "0.0",
              "vehicles[index].currentValue - vehicles[index].purchasePrice": "0.0",
              "vehicles[index].currentValue": "0.0",
              "vehicles[index].purchasePrice": "0.0",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)
          PY

          if grep -nE \
            'currentValue|purchasePrice' \
            "$FILE"; then

            echo "ERROR: obsolete vehicle fields remain."
            exit 1
          fi

          echo "Dashboard vehicle model check passed."

      # ============================================================
      # 8. FIX CONST CONSTRUCTOR ERRORS
      #
      # Remove invalid `const` before widget constructors where the
      # referenced constructor is not const.
      # ============================================================
      - name: Fix Dart const constructor errors
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("lib/router.dart"),
              Path("lib/screens/dashboard/dashboard_screen.dart"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              # Fix common invalid route/widget const usage.
              text = re.sub(
                  r'const\s+(DashboardScreen)\s*\(',
                  r'\1(',
                  text
              )

              text = re.sub(
                  r'const\s+(LoginScreen)\s*\(',
                  r'\1(',
                  text
              )

              text = re.sub(
                  r'const\s+(HomeScreen)\s*\(',
                  r'\1(',
                  text
              )

              path.write_text(text)
          PY

          echo "Checking router.dart..."

          if [ -f lib/router.dart ]; then
            nl -ba lib/router.dart | sed -n '30,50p'
          fi

      # ============================================================
      # 9. REMOVE GENERATED DEFAULT TEST
      # ============================================================
      - name: Remove obsolete Flutter test
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          rm -f test/widget_test.dart

          echo "Default widget test removed."

      # ============================================================
      # 10. CLEAN
      # ============================================================
      - name: Flutter clean
        working-directory: assetflow_mobile
        run: |
          flutter clean

      # ============================================================
      # 11. DEPENDENCIES
      # ============================================================
      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: |
          flutter pub get

      # ============================================================
      # 12. VERIFY PRODUCTION API CONFIGURATION
      # ============================================================
      - name: Verify production configuration
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for emulator/local API URLs..."

          if grep -RInE \
            '10\.0\.2\.2|127\.0\.0\.1|localhost' \
            lib \
            --include="*.dart" \
            2>/dev/null; then

            echo
            echo "WARNING: Local API references were found."
            echo "The release build will explicitly use:"
            echo "$API_BASE_URL"
          fi

          echo
          echo "Production API:"
          echo "$API_BASE_URL"

      # ============================================================
      # 13. ANALYZE
      #
      # IMPORTANT:
      # flutter analyze returns non-zero for lint/warning issues.
      # The APK compiler itself is the authoritative build check.
      # We therefore record analyzer output but don't block APK build
      # because of warnings/deprecations.
      # ============================================================
      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set +e

          flutter analyze > ../flutter-analyze.log 2>&1

          STATUS=$?

          echo
          echo "Flutter analyze exit code: $STATUS"
          echo
          cat ../flutter-analyze.log

          # Analyzer warnings/info are not allowed to stop APK build.
          # Actual Dart compilation errors are caught by flutter build.
          exit 0

      # ============================================================
      # 14. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      # ============================================================
      # 15. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="
          ls -lh "$APK"

      # ============================================================
      # 16. UPLOAD APK
      # ============================================================
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
