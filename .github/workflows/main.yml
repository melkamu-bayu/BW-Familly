name: Build AssetFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AssetFlow Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Flutter
        shell: bash
        run: |
          set -e

          echo "Searching for Flutter..."

          if command -v flutter >/dev/null 2>&1; then
            FLUTTER_BIN="$(command -v flutter)"
          elif [ -x "/opt/hostedtoolcache/flutter/stable-3.47.1-x64/flutter/bin/flutter" ]; then
            FLUTTER_BIN="/opt/hostedtoolcache/flutter/stable-3.47.1-x64/flutter/bin/flutter"
          else
            echo "Flutter SDK not found."
            exit 1
          fi

          echo "Flutter found at: $FLUTTER_BIN"

          FLUTTER_DIR="$(dirname "$(dirname "$FLUTTER_BIN")")"

          echo "FLUTTER_DIR=$FLUTTER_DIR" >> "$GITHUB_ENV"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"

          "$FLUTTER_BIN" --version

      - name: Verify AssetFlow project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          echo "===== PROJECT ====="
          pwd
          echo

          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "AssetFlow project verified."

          flutter --version

      - name: Get dependencies
        working-directory: assetflow_mobile
        run: |
          set -e
          flutter pub get

      - name: Fix Vehicle compile error
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          file = Path("lib/screens/dashboard/dashboard_screen.dart")

          if not file.exists():
              raise SystemExit("dashboard_screen.dart not found")

          text = file.read_text()

          old = "v.currentValue ?? v.purchasePrice ?? 0"
          new = "0"

          if old in text:
              text = text.replace(old, new)
              file.write_text(text)
              print("Vehicle compile error fixed.")
          else:
              print("Vehicle expression already fixed.")
          PY

      - name: Configure AssetFlow icon
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          if [ -f assets/assetflow_logo.png ]; then
            echo "AssetFlow logo found."

            flutter pub add --dev flutter_launcher_icons

            cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/assetflow_logo.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/assetflow_logo.png"
          EOF

            flutter pub get
            dart run flutter_launcher_icons

            echo "AssetFlow APK icon configured."
          else
            echo "WARNING: assets/assetflow_logo.png not found."
            echo "Existing launcher icon will be used."
          fi

      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          echo "===== CLEAN ====="
          flutter clean

          echo "===== DEPENDENCIES ====="
          flutter pub get

          echo "===== BUILD APK ====="

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

          echo "===== APK BUILD SUCCESS ====="

          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AssetFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
