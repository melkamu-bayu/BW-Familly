name: Build AssetFlow APK - New UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Check ZIP
        run: |
          set -e
          test -f AssetFlow_mobile_final_home_ui.zip
          echo 'ZIP found.'

      - name: Backup current app
        run: |
          set -e
          rm -rf assetflow_mobile_backup
          if [ -d assetflow_mobile ]; then
            cp -a assetflow_mobile assetflow_mobile_backup
          fi
          echo 'Backup step complete.'

      - name: Extract new UI
        run: |
          set -e
          rm -rf extracted_ui
          mkdir -p extracted_ui
          unzip -q AssetFlow_mobile_final_home_ui.zip -d extracted_ui
          test -f extracted_ui/assetflow_mobile/pubspec.yaml
          echo 'New UI extracted.'

      - name: Replace app
        run: |
          set -e
          rm -rf assetflow_mobile
          cp -a extracted_ui/assetflow_mobile assetflow_mobile
          test -f assetflow_mobile/pubspec.yaml
          test -f assetflow_mobile/lib/main.dart
          echo 'New UI installed.'

      - name: Create Android project if missing
        working-directory: assetflow_mobile
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Add Internet permission
        working-directory: assetflow_mobile
        run: |
          set -e
          MANIFEST='android/app/src/main/AndroidManifest.xml'
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          echo 'Internet permission confirmed.'

      - name: Install dependencies
        working-directory: assetflow_mobile
        run: |
          set -e
          flutter pub get

      - name: Analyze Flutter project
        working-directory: assetflow_mobile
        run: |
          set -e
          flutter analyze

      - name: Check production API
        run: |
          set -e
          STATUS=$(curl -L -s -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 30 'https://assetflow-api-f435.onrender.com/docs')
          echo "Production API HTTP status: $STATUS"
          test "$STATUS" = '200'

      - name: Build release APK
        working-directory: assetflow_mobile
        run: |
          set -e
          flutter build apk --release --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        run: |
          set -e
          APK='assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk'
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: AssetFlow-New-UI-Release-APK
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
