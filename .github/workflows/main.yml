name: Build AssetFlow Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AssetFlow APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify AssetFlow project
        working-directory: assetflow_mobile
        run: |
          set -e

          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "AssetFlow Flutter project found."
          echo "Flutter:"
          flutter --version

      - name: Get dependencies
        working-directory: assetflow_mobile
        run: flutter pub get

      - name: Fix dashboard Vehicle compile error
        working-directory: assetflow_mobile
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          file = Path("lib/screens/dashboard/dashboard_screen.dart")
          text = file.read_text()

          old = "v.currentValue ?? v.purchasePrice ?? 0"

          if old in text:
              text = text.replace(old, "0")
              file.write_text(text)
              print("Fixed invalid Vehicle valuation fields.")
          else:
              print("No invalid Vehicle valuation expression found.")

          if "v.currentValue" in text or "v.purchasePrice" in text:
              raise SystemExit(
                  "ERROR: Invalid Vehicle fields still exist."
              )
          PY

      - name: Configure AssetFlow launcher icon
        working-directory: assetflow_mobile
        run: |
          set -e

          test -f assets/assetflow_logo.png

          flutter pub add --dev flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/assetflow_logo.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/assetflow_logo.png"
          EOF

          flutter pub get

      - name: Generate AssetFlow launcher icon
        working-directory: assetflow_mobile
        run: |
          set -e
          dart run flutter_launcher_icons

      - name: Verify Android Gradle project
        working-directory: assetflow_mobile
        run: |
          set -e

          test -f android/gradlew

          if [ -f android/app/build.gradle ]; then
            echo "Found android/app/build.gradle"
          elif [ -f android/app/build.gradle.kts ]; then
            echo "Found android/app/build.gradle.kts"
          else
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

      - name: Clean Flutter build
        working-directory: assetflow_mobile
        run: flutter clean

      - name: Get dependencies again
        working-directory: assetflow_mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: assetflow_mobile
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        working-directory: assetflow_mobile
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "AssetFlow APK successfully generated"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-APK
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
