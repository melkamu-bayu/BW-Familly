                  icon: const Icon(Icons.arrow_back_rounded),
                  tooltip: 'Back',
                  onPressed: () {
                    if (context.canPop()) {
                      context.pop();
                    } else {
                      context.go('/properties');
                    }
                  },
                ),"""

              text = text.replace(marker, replacement, 1)

          if "package:go_router/go_router.dart" not in text:
              imports = list(
                  re.finditer(
                      r"^import\s+.+;$",
                      text,
                      re.MULTILINE,
                  )
              )

              if imports:
                  last = imports[-1]
                  text = (
                      text[:last.end()]
                      + "\nimport 'package:go_router/go_router.dart';"
                      + text[last.end():]
                  )
              else:
                  text = (
                      "import 'package:go_router/go_router.dart';\n\n"
                      + text
                  )

          path.write_text(text, encoding="utf-8")
          print("
