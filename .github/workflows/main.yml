name: AssetFlow - Fix All Child Page Back Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: assetflow_mobile
        run: flutter pub get

      - name: Fix Vehicle model
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          file="lib/models/models.dart"

          grep -q "class Vehicle" "$file"

          if ! grep -q "final double? currentValue;" "$file"; then
            sed -i '/final double mileage;/a\
  final double? currentValue;\
  final double? purchasePrice;' "$file"
          fi

          if ! grep -q "this.currentValue" "$file"; then
            sed -i '/required this.mileage,/a\
    this.currentValue,\
    this.purchasePrice,' "$file"
          fi

          if ! grep -q "currentValue: (json\['current_value'\]" "$file"; then
            sed -i "/mileage: (json\['mileage'\] as num).toDouble(),/a\
        currentValue: (json['current_value'] as num?)?.toDouble(),\
        purchasePrice: (json['purchase_price'] as num?)?.toDouble()," "$file"
          fi

          grep -q "final double? currentValue;" "$file"
          grep -q "final double? purchasePrice;" "$file"
          grep -q "this.currentValue" "$file"
          grep -q "this.purchasePrice" "$file"

          echo "Vehicle model fixed."

      - name: Add back buttons to child pages
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          find lib/screens -type f -name "*.dart" -print0 |
          while IFS= read -r -d "" file; do

            case "$file" in
              lib/screens/dashboard/*)
                continue
                ;;
              lib/screens/auth/*)
                continue
                ;;
            esac

            if ! grep -q "appBar: AppBar(" "$file"; then
              continue
            fi

            if grep -q "leading:" "$file"; then
              continue
            fi

            perl -0pi -e \
              's/appBar: AppBar\(/appBar: AppBar(\n        leading: const BackButton(),/' \
              "$file"

            echo "Back button added: $file"

          done

      - name: Format Dart
        working-directory: assetflow_mobile
        run: dart format lib

      - name: Analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings
          echo "Analyzer completed with no errors."

      - name: Check Android
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          test -f android/app/src/main/AndroidManifest.xml

      - name: Ensure Internet permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          manifest="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$manifest"; then
            perl -0pi -e \
              's#(<application)#<uses-permission android:name="android.permission.INTERNET"/>\n    $1#' \
              "$manifest"
          fi

          grep -q "android.permission.INTERNET" "$manifest"

      - name: Build APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK build successful."

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/lib
          git add assetflow_mobile/android

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix child page back buttons and Vehicle model"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
