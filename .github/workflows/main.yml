name: AssetFlow - Update Existing Machine and Vehicle Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Locate existing asset data
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          echo "=== Searching existing asset data ==="

          grep -RniE \
            "vehicleType|plateNumber|vehicles:|Vehicle\\(" \
            lib \
            --include="*.dart" \
            > /tmp/asset_locations.txt || true

          cat /tmp/asset_locations.txt

          echo ""
          echo "=== Searching existing asset names ==="

          grep -RniE \
            "EX-|A[0-9]{5}/[0-9]{5}|Land-Cruiser" \
            lib \
            --include="*.dart" \
            || true

      - name: Update existing asset records
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          requested = {
              "EX-3952",
              "EX-4541",
              "A28405/01001",
              "A26401/15598",
              "A19876/35760",
              "Land-Cruiser",
          }

          found = []

          for path in Path("lib").rglob("*.dart"):
              text = path.read_text(errors="ignore")

              for value in requested:
                  if value in text:
                      found.append((path, value))

          print("Requested assets already present:")

          for path, value in found:
              print(f"  {path}: {value}")

          if not found:
              print("")
              print("No hardcoded asset records exist in the mobile source.")
              print("")
              print("IMPORTANT:")
              print("The application receives Vehicle records from the API.")
              print("Therefore no fake local asset list will be created.")
              print("")
              print("The asset update must be performed through the backend/API.")
              raise SystemExit(2)
          PY

      - name: Flutter dependencies
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail
          flutter pub get

      - name: Analyze application
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter analyze lib \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Show changes
        run: |
          set -euo pipefail

          git status --short
          git diff -- assetflow_mobile/lib

      - name: Commit update
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No source changes were made."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/lib

          git commit \
            -m "update(assetflow): update machine and vehicle assets"

          git push
