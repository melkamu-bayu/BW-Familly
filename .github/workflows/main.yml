name: Flatten Extracted Files
on:
  workflow_dispatch:
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move extracted/bwfamily/* to repo root
        run: |
          set -e
          SRC="extracted/bwfamily"
          if [ ! -d "$SRC" ]; then
            echo "Nothing to flatten -- $SRC not found. Already flat?"
            exit 0
          fi

          # Move everything (including dotfiles) up to repo root, but don't
          # clobber this workflow file itself or an existing top-level README
          # -- back the README up for manual comparison instead of overwriting silently.
          shopt -s dotglob
          for item in "$SRC"/*; do
            name="$(basename "$item")"
            if [ "$name" = "README.md" ] && [ -f "README.md" ]; then
              mv "$item" "./README.md.from-bwfamily"
            else
              mv "$item" "./$name"
            fi
          done

          rm -rf extracted

      - name: Commit flattened structure
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Flatten extracted/bwfamily/* to repo root" || echo "No changes"
          git push
