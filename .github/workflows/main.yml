name: AssetFlow - Fix All Child Page Back Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-buttons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ============================================================
      # 1. Verify the actual AssetFlow project
      # ============================================================
      - name: Verify AssetFlow project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/models/models.dart
          test -f lib/router.dart
          test -f lib/widgets/nav_shell.dart
          test -f lib/screens/dashboard/dashboard_screen.dart
          test -f lib/screens/vehicles/vehicle_detail_screen.dart
          test -f lib/screens/properties/property_detail_screen.dart

          echo "AssetFlow project verified."

      # ============================================================
      # 2. Get dependencies BEFORE editing
      # ============================================================
      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: flutter pub get

      # ============================================================
      # 3. Fix Vehicle model
      #
      # Backend VehicleOut contains:
      #   purchase_price
      #   current_value
      #
      # Dashboard already consumes both.
      #
      # Replace ONLY the Vehicle class.
      # No fragile constructor marker.
      # ============================================================
      - name: Fix Vehicle model compatibility
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/models/models.dart")
          text = path.read_text(encoding="utf-8")

          start = text.find("class Vehicle {")
          end = text.find("class VehicleProfitability {")

          if start == -1:
              raise SystemExit(
                  "ERROR: class Vehicle was not found."
              )

          if end == -1:
              raise SystemExit(
                  "ERROR: class VehicleProfitability was not found."
              )

          if end <= start:
              raise SystemExit(
                  "ERROR: Invalid Vehicle class boundaries."
              )

          vehicle_class = """class Vehicle {
            final String id;
            final String businessUnitId;
            final String name;
            final String? plateNumber;
            final String? vehicleType;
            final String? driverName;
            final double mileage;
            final String status;
            final double? currentValue;
            final double? purchasePrice;

            Vehicle({
              required this.id,
              required this.businessUnitId,
              required this.name,
              this.plateNumber,
              this.vehicleType,
              this.driverName,
              required this.mileage,
              required this.status,
              this.currentValue,
              this.purchasePrice,
            });

            factory Vehicle.fromJson(Map<String, dynamic> json) => Vehicle(
                  id: json['id'] as String,
                  businessUnitId: json['business_unit_id'] as String,
                  name: json['name'] as String,
                  plateNumber: json['plate_number'] as String?,
                  vehicleType: json['vehicle_type'] as String?,
                  driverName: json['driver_name'] as String?,
                  mileage: (json['mileage'] as num).toDouble(),
                  status: json['status'] as String,
                  currentValue: (json['current_value'] as num?)?.toDouble(),
                  purchasePrice: (json['purchase_price'] as num?)?.toDouble(),
                );
          }

          """

          new_text = text[:start] + vehicle_class + text[end:]

          path.write_text(new_text, encoding="utf-8")

          print("Vehicle model updated successfully.")
          print("Added:")
          print("  - currentValue")
          print("  - purchasePrice")
          print("  - current_value JSON mapping")
          print("  - purchase_price JSON mapping")
          PY

      # ============================================================
      # 4. Fix all child/detail page Back buttons
      #
      # IMPORTANT:
      # Do not touch NavShell.
      # Do not touch router.
      # Do not touch dashboard.
      # ============================================================
      - name: Fix child page Back buttons
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path("lib/screens/vehicles/vehicle_detail_screen.dart"),
              Path("lib/screens/properties/property_detail_screen.dart"),
          ]

          for path in pages:
              if not path.exists():
                  raise SystemExit(
                      f"ERROR: Required child page missing: {path}"
                  )

              text = path.read_text(encoding="utf-8")

              # Already fixed.
              if "tooltip: 'Back'" in text:
                  print(f"Already has Back button: {path}")
                  continue

              marker = "appBar: AppBar("

              if marker not in text:
                  raise SystemExit(
                      f"ERROR: AppBar not found in {path}"
                  )

              replacement = """appBar: AppBar(
                leading: IconButton(
                  icon: const Icon(Icons.arrow_back_rounded),
                  tooltip: 'Back',
                  onPressed: () {
                    if (context.canPop()) {
                      context.pop();
                    } else {
                      context.go('/dashboard');
                    }
                  },
                ),"""

              text = text.replace(
                  marker,
                  replacement,
                  1,
              )

              # Add go_router import if required.
              if "package:go_router/go_router.dart" not in text:
                  imports = list(
                      re.finditer(
                          r"^import\s+.+;$",
                          text,
                          re.MULTILINE,
                      )
                  )

                  if imports:
                      last = imports[-1]
                      text = (
                          text[:last.end()]
                          + "\n"
                          + "import 'package:go_router/go_router.dart';"
                          + text[last.end():]
                      )
                  else:
                      text = (
                          "import 'package:go_router/go_router.dart';\n\n"
                          + text
                      )

              path.write_text(text, encoding="utf-8")

              print(f"Back button fixed: {path}")

          print("Child page navigation fix completed.")
          PY

      # ============================================================
      # 5. Format only files changed by this workflow
      # ============================================================
      - name: Format modified Dart files
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            lib/models/models.dart \
            lib/screens/vehicles/vehicle_detail_screen.dart \
            lib/screens/properties/property_detail_screen.dart

      # ============================================================
      # 6. Verify model fields BEFORE analyzer
      # ============================================================
      - name: Verify Vehicle model
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          grep -q "final double? currentValue;" lib/models/models.dart
          grep -q "final double? purchasePrice;" lib/models/models.dart
          grep -q "this.currentValue" lib/models/models.dart
          grep -q "this.purchasePrice" lib/models/models.dart
          grep -q "json\\['current_value'\\]" lib/models/models.dart
          grep -q "json\\['purchase_price'\\]" lib/models/models.dart

          echo "Vehicle model compatibility verified."

      # ============================================================
      # 7. Verify dashboard references are now resolvable
      # ============================================================
      - name: Verify dashboard compatibility
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          grep -q "v.currentValue" \
            lib/screens/dashboard/dashboard_screen.dart

          grep -q "v.purchasePrice" \
            lib/screens/dashboard/dashboard_screen.dart

          echo "Dashboard Vehicle references verified."

      # ============================================================
      # 8. Flutter analyze
      #
      # Existing INFO messages are allowed.
      # Actual analyzer ERRORs are NOT allowed.
      # ============================================================
      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -o pipefail

          echo "Running Flutter analyzer..."

          flutter analyze 2>&1 | tee /tmp/flutter-analyze.log

          ANALYZE_STATUS=${PIPESTATUS[0]}

          echo
          echo "Checking for actual analyzer errors..."

          if grep -E \
            "^[[:space:]]*error •|^[[:space:]]*error:" \
            /tmp/flutter-analyze.log
          then
            echo
            echo "ERROR: Flutter analyzer reported actual errors."
            exit 1
          fi

          if [[ "$ANALYZE_STATUS" -ne 0 ]]; then
            echo
            echo "Flutter analyzer returned status $ANALYZE_STATUS."
            echo "No analyzer 'error •' entries were found."
            echo "Existing warnings/info are not source-breaking errors."
          fi

          echo
          echo "No Flutter analyzer errors detected."

      # ============================================================
      # 9. Ensure Android project exists
      # ============================================================
      - name: Ensure Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d android ]]; then
            echo "Android project missing."
            echo "Creating Android platform files..."

            flutter create \
              --platforms=android \
              --project-name=assetflow_mobile \
              .
          fi

          test -d android
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project verified."

      # ============================================================
      # 10. INTERNET permission
      # ============================================================
      - name: Ensure INTERNET permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q \
            'android.permission.INTERNET' \
            "$MANIFEST"
          then
            python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          permission = (
              '\n    <uses-permission '
              'android:name="android.permission.INTERNET"/>\n'
          )

          if "<application" not in text:
              raise SystemExit(
                  "ERROR: Android application element not found."
              )

          text = text.replace(
              "<application",
              permission + "    <application",
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY
          fi

          grep -q \
            'android.permission.INTERNET' \
            "$MANIFEST"

          echo "INTERNET permission verified."

      # ============================================================
      # 11. Final analyzer after Android setup
      # ============================================================
      - name: Final Flutter analyzer
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -o pipefail

          flutter analyze 2>&1 | tee /tmp/flutter-analyze-final.log

          STATUS=${PIPESTATUS[0]}

          if grep -E \
            "^[[:space:]]*error •|^[[:space:]]*error:" \
            /tmp/flutter-analyze-final.log
          then
            echo "ERROR: Final Flutter analyzer found source errors."
            exit 1
          fi

          echo "Final analyzer contains no source errors."

          if [[ "$STATUS" -ne 0 ]]; then
            echo "Analyzer has existing warnings/info only."
          fi

      # ============================================================
      # 12. Build release APK
      # ============================================================
      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      # ============================================================
      # 13. Final safety verification
      # ============================================================
      - name: Final safety verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Changed files:"
          git status --short

          echo
          echo "Checking protected navigation files..."

          if git diff --name-only | grep -E \
            '^assetflow_mobile/lib/widgets/nav_shell\.dart$|^assetflow_mobile/lib/router\.dart$'
          then
            echo "ERROR: Router/NavShell was modified."
            exit 1
          fi

          echo
          echo "Checking intended files..."

          git diff --name-only | grep \
            '^assetflow_mobile/lib/models/models\.dart$' >/dev/null

          git diff --name-only | grep \
            '^assetflow_mobile/lib/screens/vehicles/vehicle_detail_screen\.dart$' >/dev/null

          git diff --name-only | grep \
            '^assetflow_mobile/lib/screens/properties/property_detail_screen\.dart$' >/dev/null

          echo "Final safety verification passed."

      # ============================================================
      # 14. Commit source changes
      # ============================================================
      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assetflow_mobile/lib/models/models.dart \
            assetflow_mobile/lib/screens/vehicles/vehicle_detail_screen.dart \
            assetflow_mobile/lib/screens/properties/property_detail_screen.dart \
            assetflow_mobile/android

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Fix all child page back buttons and vehicle model"

          git push origin master

      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
