name: AssetFlow - Fix All Child Page Back Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-buttons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ============================================================
      # Verify project
      # ============================================================
      - name: Verify AssetFlow project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "pubspec.yaml"
            "lib/models/models.dart"
            "lib/router.dart"
            "lib/widgets/nav_shell.dart"
            "lib/screens/dashboard/dashboard_screen.dart"
            "lib/screens/vehicles/vehicle_detail_screen.dart"
            "lib/screens/properties/property_detail_screen.dart"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "ERROR: Missing $file"
              exit 1
            }
          done

          grep -q "go_router:" pubspec.yaml
          grep -q "ShellRoute(" lib/router.dart
          grep -q "/vehicles/:id" lib/router.dart
          grep -q "/properties/:id" lib/router.dart

          echo "AssetFlow project verified."

      # ============================================================
      # Dependencies
      # ============================================================
      - name: Flutter pub get
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      # ============================================================
      # Fix Vehicle model
      #
      # Dashboard already uses:
      #   currentValue
      #   purchasePrice
      #
      # Backend provides:
      #   current_value
      #   purchase_price
      # ============================================================
      - name: Fix Vehicle model compatibility
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/models/models.dart")
          text = path.read_text(encoding="utf-8")

          start = text.find("class Vehicle {")
          end = text.find("class VehicleProfitability {")

          if start < 0:
              raise SystemExit("ERROR: Vehicle class not found.")

          if end < 0:
              raise SystemExit(
                  "ERROR: VehicleProfitability class not found."
              )

          if end <= start:
              raise SystemExit(
                  "ERROR: Invalid Vehicle class boundaries."
              )

          vehicle = """class Vehicle {
            final String id;
            final String businessUnitId;
            final String name;
            final String? plateNumber;
            final String? vehicleType;
            final String? driverName;
            final double mileage;
            final String status;
            final double? currentValue;
            final double? purchasePrice;

            Vehicle({
              required this.id,
              required this.businessUnitId,
              required this.name,
              this.plateNumber,
              this.vehicleType,
              this.driverName,
              required this.mileage,
              required this.status,
              this.currentValue,
              this.purchasePrice,
            });

            factory Vehicle.fromJson(Map<String, dynamic> json) => Vehicle(
                  id: json['id'] as String,
                  businessUnitId: json['business_unit_id'] as String,
                  name: json['name'] as String,
                  plateNumber: json['plate_number'] as String?,
                  vehicleType: json['vehicle_type'] as String?,
                  driverName: json['driver_name'] as String?,
                  mileage: (json['mileage'] as num).toDouble(),
                  status: json['status'] as String,
                  currentValue:
                      (json['current_value'] as num?)?.toDouble(),
                  purchasePrice:
                      (json['purchase_price'] as num?)?.toDouble(),
                );
          }

          """

          text = text[:start] + vehicle + text[end:]

          path.write_text(text, encoding="utf-8")

          print("Vehicle model compatibility fixed.")
          PY

      # ============================================================
      # Back button helper
      #
      # Only actual nested/detail pages are changed.
      # ============================================================
      - name: Fix Vehicle detail Back button
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "lib/screens/vehicles/vehicle_detail_screen.dart"
          )

          text = path.read_text(encoding="utf-8")

          if "tooltip: 'Back'" not in text:

              marker = "appBar: AppBar("

              if marker not in text:
                  raise SystemExit(
                      "ERROR: Vehicle detail AppBar not found."
                  )

              replacement = """appBar: AppBar(
                leading: IconButton(
                  icon: const Icon(Icons.arrow_back_rounded),
                  tooltip: 'Back',
                  onPressed: () {
                    if (context.canPop()) {
                      context.pop();
                    } else {
                      context.go('/vehicles');
                    }
                  },
                ),"""

              text = text.replace(marker, replacement, 1)

          if "package:go_router/go_router.dart" not in text:
              imports = list(
                  re.finditer(
                      r"^import\s+.+;$",
                      text,
                      re.MULTILINE,
                  )
              )

              if imports:
                  last = imports[-1]
                  text = (
                      text[:last.end()]
                      + "\nimport 'package:go_router/go_router.dart';"
                      + text[last.end():]
                  )
              else:
                  text = (
                      "import 'package:go_router/go_router.dart';\n\n"
                      + text
                  )

          path.write_text(text, encoding="utf-8")
          print("Vehicle detail Back button verified.")
          PY

      - name: Fix Property detail Back button
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
