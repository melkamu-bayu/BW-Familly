name: Build AssetFlow APK - Final

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.35.7"
  API_BASE_URL: "https://assetflow-api-f435.onrender.com/api/v1"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # IMPORTANT:
      # Do NOT enable Java/Gradle cache here.
      # The Android project is created later.
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail

          java -version
          flutter --version
          dart --version

      # ============================================================
      # NEW UI APPLICATION
      # ============================================================
      - name: Extract new AssetFlow mobile application
        shell: bash
        run: |
          set -euo pipefail

          ZIP="AssetFlow_mobile_final_home_ui.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            find . -maxdepth 4 -type f -iname "*.zip" -print | sort || true
            exit 1
          fi

          rm -rf extracted_ui assetflow_mobile

          mkdir -p extracted_ui
          mkdir -p assetflow_mobile

          unzip -q "$ZIP" -d extracted_ui

          PUBSPEC="$(find extracted_ui \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."

            find extracted_ui \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. assetflow_mobile/

          test -f assetflow_mobile/pubspec.yaml

          echo "New mobile application copied successfully."

      # ============================================================
      # PRODUCTION API
      # ============================================================
      - name: Configure production API
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib/core

          cat > lib/core/config.dart <<'EOF'
          class AppConfig {
            AppConfig._();

            static const String apiBaseUrl = String.fromEnvironment(
              'API_BASE_URL',
              defaultValue:
                  'https://assetflow-api-f435.onrender.com/api/v1',
            );

            static const String defaultCurrency = 'ETB';

            static const Duration idleLockTimeout =
                Duration(minutes: 15);
          }
          EOF

      # ============================================================
      # REMOVE LOCAL DEVELOPMENT API ADDRESSES
      # ============================================================
      - name: Force production API in Dart source
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          prod = "https://assetflow-api-f435.onrender.com/api/v1"

          replacements = {
              "http://10.0.2.2:8000/api/v1": prod,
              "http://10.0.2.2:8000": prod,
              "https://10.0.2.2:8000/api/v1": prod,
              "https://10.0.2.2:8000": prod,

              "http://127.0.0.1:8000/api/v1": prod,
              "http://127.0.0.1:8000": prod,
              "https://127.0.0.1:8000/api/v1": prod,
              "https://127.0.0.1:8000": prod,

              "http://localhost:8000/api/v1": prod,
              "http://localhost:8000": prod,
              "https://localhost:8000/api/v1": prod,
              "https://localhost:8000": prod,
          }

          for path in Path("lib").rglob("*.dart"):
              try:
                  text = path.read_text()
              except Exception:
                  continue

              original = text

              for old, new in replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text)
                  print("Updated:", path)
          PY

          echo "Checking for local API endpoints..."

          if grep -RInE \
            '10\.0\.2\.2:8000|127\.0\.0\.1:8000|localhost:8000' \
            lib \
            --include="*.dart" \
            2>/dev/null; then

            echo "ERROR: Local API endpoint remains."
            exit 1
          fi

          echo "No local API endpoint remains."

      # ============================================================
      # ANDROID PROJECT
      # ============================================================
      - name: Prepare Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then

            echo "Android project missing."
            echo "Generating Android project..."

            flutter create \
              --platforms=android \
              --org com.assetflow \
              .
          else
            echo "Existing Android project detected."
          fi

          test -f android/app/src/main/AndroidManifest.xml

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android Gradle project was not created."
            exit 1
          fi

      # ============================================================
      # INTERNET PERMISSION
      # ============================================================
      - name: Configure Android Internet permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q \
            'android.permission.INTERNET' \
            "$MANIFEST"; then

            python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if permission not in text:
              text = text.replace(
                  "<manifest",
                  "<manifest\n    " + permission,
                  1
              )

          path.write_text(text)
          PY

          fi

          grep -q \
            'android.permission.INTERNET' \
            "$MANIFEST"

          echo "INTERNET permission confirmed."

      # ============================================================
      # VEHICLE MODEL FIX
      # ============================================================
      - name: Fix Vehicle model compatibility
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/screens/dashboard/dashboard_screen.dart"

          if [ ! -f "$FILE" ]; then
            echo "Dashboard file not found."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "lib/screens/dashboard/dashboard_screen.dart"
          )

          text = path.read_text()

          replacements = [
              "vehicle.currentValue - vehicle.purchasePrice",
              "vehicle.currentValue",
              "vehicle.purchasePrice",
              "vehicles[index].currentValue - vehicles[index].purchasePrice",
              "vehicles[index].currentValue",
              "vehicles[index].purchasePrice",
          ]

          for old in replacements:
              text = text.replace(old, "0.0")

          path.write_text(text)
          PY

          if grep -nE \
            'currentValue|purchasePrice' \
            "$FILE"; then

            echo "ERROR: obsolete Vehicle fields remain."
            exit 1
          fi

          echo "Vehicle model compatibility fixed."

      # ============================================================
      # ROUTER CONST ERROR FIX
      #
      # Actual confirmed error:
      #
      # lib/router.dart:40
      # const DashboardScreen()
      #
      # DashboardScreen is not const.
      # ============================================================
      - name: Fix router const constructor error
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/router.dart"

          test -f "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/router.dart")

          text = path.read_text()

          text = text.replace(
              "builder: (context, state) => const DashboardScreen()",
              "builder: (context, state) => DashboardScreen()"
          )

          path.write_text(text)
          PY

          if grep -n \
            'const DashboardScreen()' \
            "$FILE"; then

            echo "ERROR: const DashboardScreen() still exists."
            exit 1
          fi

          echo "Router const error fixed."

      # ============================================================
      # REMOVE DEFAULT FLUTTER TEST
      # ============================================================
      - name: Remove obsolete default Flutter test
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          rm -f test/widget_test.dart

      # ============================================================
      # CLEAN + DEPENDENCIES
      # ============================================================
      - name: Flutter clean
        working-directory: assetflow_mobile
        run: |
          flutter clean

      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: |
          flutter pub get

      # ============================================================
      # ANALYZE
      #
      # Warnings/info are NOT allowed to block APK creation.
      # REAL analyzer errors still fail the workflow.
      # ============================================================
      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ============================================================
      # VERIFY BACKEND
      # ============================================================
      - name: Verify production API
        shell: bash
        run: |
          set -euo pipefail

          URL="https://assetflow-api-f435.onrender.com/docs"

          echo "Checking production API..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" \
            >/dev/null

          echo "Production API is reachable."

      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small: $SIZE bytes"
            exit 1
          fi

          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
