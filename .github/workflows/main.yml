name: AssetFlow - Fix All Child Page Back Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-buttons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: flutter pub get

      - name: Verify required files
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "pubspec.yaml"
            "lib/router.dart"
            "lib/widgets/nav_shell.dart"
            "lib/models/models.dart"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
          done

          echo "Required files verified."

      - name: Verify Vehicle model
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/models/models.dart"

          grep -q "currentValue" "$FILE" || {
            echo "ERROR: Vehicle.currentValue missing."
            exit 1
          }

          grep -q "purchasePrice" "$FILE" || {
            echo "ERROR: Vehicle.purchasePrice missing."
            exit 1
          }

          echo "Vehicle model verified."

      - name: Verify child page files
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          find lib/screens -type f -name "*.dart" | sort

          echo "Child screen source files discovered."

      - name: Fix Vehicle detail back button
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/screens/vehicles/vehicle_detail_screen.dart"

          test -f "$FILE"

          if ! grep -q "package:go_router/go_router.dart" "$FILE"; then
            sed -i "1i import 'package:go_router/go_router.dart';" "$FILE"
          fi

          if ! grep -q "tooltip: 'Back'" "$FILE"; then
            sed -i '/appBar: AppBar(/a\
              leading: IconButton(\
                icon: const Icon(Icons.arrow_back_rounded),\
                tooltip: '\''Back'\'',\
                onPressed: () {\
                  if (context.canPop()) {\
                    context.pop();\
                  } else {\
                    context.go('\''/vehicles'\'');\
                  }\
                },\
              ),' "$FILE"
          fi

          echo "Vehicle detail back button verified."

      - name: Fix Property detail back button
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/screens/properties/property_detail_screen.dart"

          test -f "$FILE"

          if ! grep -q "package:go_router/go_router.dart" "$FILE"; then
            sed -i "1i import 'package:go_router/go_router.dart';" "$FILE"
          fi

          if ! grep -q "tooltip: 'Back'" "$FILE"; then
            sed -i '/appBar: AppBar(/a\
              leading: IconButton(\
                icon: const Icon(Icons.arrow_back_rounded),\
                tooltip: '\''Back'\'',\
                onPressed: () {\
                  if (context.canPop()) {\
                    context.pop();\
                  } else {\
                    context.go('\''/properties'\'');\
                  }\
                },\
              ),' "$FILE"
          fi

          echo "Property detail back button verified."

      - name: Format Dart
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            lib/screens/vehicles/vehicle_detail_screen.dart \
            lib/screens/properties/property_detail_screen.dart

      - name: Verify navigation changes
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          grep -q "context.canPop()" \
            lib/screens/vehicles/vehicle_detail_screen.dart

          grep -q "context.go('/vehicles')" \
            lib/screens/vehicles/vehicle_detail_screen.dart

          grep -q "context.canPop()" \
            lib/screens/properties/property_detail_screen.dart

          grep -q "context.go('/properties')" \
            lib/screens/properties/property_detail_screen.dart

          echo "Navigation verification passed."

      - name: Verify protected files unchanged
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only | grep -E \
            'assetflow_mobile/lib/(router|widgets/nav_shell)\.dart'
          then
            echo "ERROR: router.dart or nav_shell.dart was modified."
            exit 1
          fi

          echo "Protected navigation files unchanged."

      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-fatal-warnings

          echo "Flutter analyzer passed."

      - name: Ensure Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          test -d android || flutter create --platforms=android .

          test -f android/app/src/main/AndroidManifest.xml

      - name: Ensure INTERNET permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$FILE"; then
            sed -i '/<application/i\
    <uses-permission android:name="android.permission.INTERNET"/>' "$FILE"
          fi

          grep -q "android.permission.INTERNET" "$FILE"

      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK built successfully."

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assetflow_mobile/lib/screens/vehicles/vehicle_detail_screen.dart \
            assetflow_mobile/lib/screens/properties/property_detail_screen.dart \
            assetflow_mobile/android

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Fix child page back buttons"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
