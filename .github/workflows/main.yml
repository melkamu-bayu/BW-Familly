name: Build AssetFlow APK - New UI

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ============================================================
      # INSTALL NEW MOBILE APPLICATION
      # ============================================================
      - name: Extract new mobile application
        shell: bash
        run: |
          set -euo pipefail

          ZIP="AssetFlow_mobile_final_home_ui.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in repository root."
            echo
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          rm -rf extracted_ui
          mkdir -p extracted_ui

          unzip -q "$ZIP" -d extracted_ui

          echo "Searching for Flutter project..."

          PROJECT="$(find extracted_ui \
            -type f \
            -name pubspec.yaml \
            -print \
            | head -n 1 \
            | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No pubspec.yaml found inside $ZIP"
            find extracted_ui -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Flutter project: $PROJECT"

          rm -rf assetflow_mobile
          mkdir -p assetflow_mobile

          cp -a "$PROJECT"/. assetflow_mobile/

          if [ ! -f assetflow_mobile/pubspec.yaml ]; then
            echo "ERROR: Flutter project installation failed."
            exit 1
          fi

          echo "New mobile application installed successfully."

      # ============================================================
      # PRODUCTION API CONFIGURATION
      # ============================================================
      - name: Configure production API
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib/core

          cat > lib/core/config.dart <<'EOF'
          class AppConfig {
            AppConfig._();

            static const String apiBaseUrl = String.fromEnvironment(
              'API_BASE_URL',
              defaultValue:
                  'https://assetflow-api-f435.onrender.com/api/v1',
            );

            static const String defaultCurrency = 'ETB';

            static const Duration idleLockTimeout =
                Duration(minutes: 15);
          }
          EOF

      # ============================================================
      # ANDROID PROJECT
      # ============================================================
      - name: Prepare Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "Android project missing. Creating it..."
            flutter create --platforms=android .
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          marker = "<manifest"

          pos = text.find(marker)

          if pos == -1:
              raise SystemExit("Could not find <manifest>")

          end = text.find(">", pos)

          if end == -1:
              raise SystemExit("Could not find end of <manifest>")

          permission = '\n    <uses-permission android:name="android.permission.INTERNET"/>'

          text = text[:end + 1] + permission + text[end + 1:]

          p.write_text(text)
          PY
          fi

          echo "Checking INTERNET permission..."
          grep -q "android.permission.INTERNET" "$MANIFEST"

      # ============================================================
      # REMOVE DEFAULT FLUTTER TEST
      # ============================================================
      - name: Remove obsolete default Flutter test
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          rm -f test/widget_test.dart

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Flutter clean
        working-directory: assetflow_mobile
        run: flutter clean

      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: flutter pub get

      # ============================================================
      # FIX VEHICLE MODEL ERRORS
      #
      # The actual Vehicle model does not contain:
      #   currentValue
      #   purchasePrice
      #
      # Remove ONLY these invalid references.
      # ============================================================
      - name: Fix Vehicle model references
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/screens/dashboard/dashboard_screen.dart"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Dashboard file not found:"
            echo "$FILE"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/screens/dashboard/dashboard_screen.dart")
          text = path.read_text()

          # Handle normal vehicle variables.
          text = re.sub(
              r'\b([A-Za-z_][A-Za-z0-9_]*)\.currentValue\b',
              '0.0',
              text
          )

          text = re.sub(
              r'\b([A-Za-z_][A-Za-z0-9_]*)\.purchasePrice\b',
              '0.0',
              text
          )

          # Handle indexed vehicle expressions.
          text = re.sub(
              r'\b([A-Za-z_][A-Za-z0-9_]*)\[[^\]]+\]\.currentValue\b',
              '0.0',
              text
          )

          text = re.sub(
              r'\b([A-Za-z_][A-Za-z0-9_]*)\[[^\]]+\]\.purchasePrice\b',
              '0.0',
              text
          )

          path.write_text(text)
          PY

          echo "Checking dashboard for obsolete Vehicle fields..."

          if grep -nE \
            'currentValue|purchasePrice' \
            "$FILE"; then
            echo "ERROR: Vehicle fields still remain."
            exit 1
          fi

      # ============================================================
      # FIX CONST ERROR
      #
      # Flutter reported:
      # const_with_non_const
      # dashboard_screen.dart:203
      #
      # Remove const only from the offending constructor expression.
      # ============================================================
      - name: Fix dashboard const constructor error
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          FILE="lib/screens/dashboard/dashboard_screen.dart"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/screens/dashboard/dashboard_screen.dart")
          lines = path.read_text().splitlines()

          # The analyzer previously reported the error at line 203.
          # Remove only the const keyword on that line.
          target = 203

          if len(lines) >= target:
              line = lines[target - 1]

              if "const " in line:
                  lines[target - 1] = line.replace("const ", "", 1)
                  print("Removed const from dashboard line 203.")
              else:
                  print("No const keyword found on dashboard line 203.")

          path.write_text("\n".join(lines) + "\n")
          PY

      # ============================================================
      # FIRST ANALYSIS
      # ============================================================
      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -o pipefail

          flutter analyze 2>&1 | tee ../flutter-analyze.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "Flutter analyze exit code: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "Analyzer still reports real Dart errors."
            echo "Full analyzer output:"
            cat ../flutter-analyze.log
            exit "$STATUS"
          fi

      # ============================================================
      # VERIFY PRODUCTION API
      # ============================================================
      - name: Verify production API
        shell: bash
        run: |
          set -euo pipefail

          API="https://assetflow-api-f435.onrender.com/docs"

          echo "Checking:"
          echo "$API"

          HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 \
            "$API")"

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Production API is not reachable."
            exit 1
          fi

      # ============================================================
      # BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          ls -lh "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
