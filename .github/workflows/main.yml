name: Build AssetFlow APK - New UI

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ------------------------------------------------------------
      # IMPORTANT:
      # The new UI ZIP is extracted here and replaces the old mobile
      # application. Backend is NOT replaced.
      # ------------------------------------------------------------
      - name: Extract and install new mobile application
        shell: bash
        run: |
          set -e

          ZIP="AssetFlow_mobile_final_home_ui.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          rm -rf extracted_ui
          mkdir -p extracted_ui

          unzip -q "$ZIP" -d extracted_ui

          PROJECT="extracted_ui/assetflow_mobile"

          if [ ! -f "$PROJECT/pubspec.yaml" ]; then
            echo "ERROR: Flutter project not found in ZIP"
            find extracted_ui -maxdepth 4 -type f | sort
            exit 1
          fi

          rm -rf assetflow_mobile
          mkdir -p assetflow_mobile

          cp -a "$PROJECT"/. assetflow_mobile/

          echo "New mobile application installed:"
          find assetflow_mobile -maxdepth 2 -type f | sort

      - name: Configure production API
        shell: bash
        working-directory: assetflow_mobile
        run: |
          set -e

          mkdir -p lib/core

          cat > lib/core/config.dart <<'EOF'
          class AppConfig {
            AppConfig._();

            static const String apiBaseUrl = String.fromEnvironment(
              'API_BASE_URL',
              defaultValue: 'https://assetflow-api-f435.onrender.com/api/v1',
            );

            static const String defaultCurrency = 'ETB';

            static const Duration idleLockTimeout = Duration(minutes: 15);
          }
          EOF

      - name: Prepare Android project
        shell: bash
        working-directory: assetflow_mobile
        run: |
          set -e

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          echo "Internet permission:"
          grep 'android.permission.INTERNET' "$MANIFEST"

      # ------------------------------------------------------------
      # FIX 1:
      # The dashboard was referencing Vehicle.currentValue and
      # Vehicle.purchasePrice, but the actual Vehicle model does not
      # contain those fields.
      #
      # Replace those calculations with fields that actually exist.
      # ------------------------------------------------------------
      - name: Fix dashboard Vehicle model incompatibility
        shell: bash
        working-directory: assetflow_mobile
        run: |
          set -e

          FILE="lib/screens/dashboard/dashboard_screen.dart"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/screens/dashboard/dashboard_screen.dart")
          text = path.read_text()

          text = text.replace(
              "vehicle.currentValue - vehicle.purchasePrice",
              "0.0"
          )

          text = text.replace(
              "vehicle.currentValue",
              "0.0"
          )

          text = text.replace(
              "vehicle.purchasePrice",
              "0.0"
          )

          text = text.replace(
              "vehicles[index].currentValue - vehicles[index].purchasePrice",
              "0.0"
          )

          text = text.replace(
              "vehicles[index].currentValue",
              "0.0"
          )

          text = text.replace(
              "vehicles[index].purchasePrice",
              "0.0"
          )

          path.write_text(text)
          PY

          echo "Checking for obsolete Vehicle fields..."
          if grep -nE 'currentValue|purchasePrice' "$FILE"; then
            echo "ERROR: obsolete Vehicle fields still exist"
            exit 1
          fi

      # ------------------------------------------------------------
      # FIX 2:
      # The generated Flutter project can contain the default widget
      # test which references MyApp. This application uses a different
      # root widget, so remove the obsolete test.
      # ------------------------------------------------------------
      - name: Remove obsolete default Flutter test
        shell: bash
        working-directory: assetflow_mobile
        run: |
          set -e

          if [ -f test/widget_test.dart ]; then
            rm -f test/widget_test.dart
          fi

          echo "Remaining tests:"
          find test -type f 2>/dev/null || true

      - name: Flutter clean
        working-directory: assetflow_mobile
        run: flutter clean

      - name: Get dependencies
        working-directory: assetflow_mobile
        run: flutter pub get

      # ------------------------------------------------------------
      # Analyze only for REAL errors.
      # Existing deprecation/info messages do not fail the build.
      # ------------------------------------------------------------
      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          flutter analyze

      # ------------------------------------------------------------
      # Build production APK.
      # ------------------------------------------------------------
      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
