name: Diagnose AssetFlow Project

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show repository structure
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Top-level files and folders:"
          ls -la

          echo ""
          echo "Searching for pubspec.yaml:"
          find . -name "pubspec.yaml" -not -path "./.git/*" -print

          echo ""
          echo "Searching for AndroidManifest.xml:"
          find . -name "AndroidManifest.xml" -not -path "./.git/*" -print

          echo ""
          echo "Searching for android directories:"
          find . -type d -name "android" -not -path "./.git/*" -print

          echo ""
          echo "Repository structure:"
          find . -maxdepth 4 -type f \
            -not -path "./.git/*" \
            | sort
