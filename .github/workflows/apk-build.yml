name: Build AssetFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Test Render API
        run: |
          set -e

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://assetflow-api-f435.onrender.com/docs)

          echo "Render API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Render API is not reachable."
            exit 1
          fi

          echo "Render API is reachable."

      - name: Create Android project
        working-directory: assetflow_mobile
        run: |
          flutter create .
          echo "Android project created."

      - name: Add Android Internet permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "Internet permission already exists."
          else
            python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET"/>\n'

          start = text.find("<manifest")

          if start == -1:
              raise SystemExit("ERROR: <manifest> tag not found.")

          end = text.find(">", start)

          if end == -1:
              raise SystemExit("ERROR: Invalid manifest.")

          text = text[:end + 1] + "\n" + permission + text[end + 1:]

          manifest.write_text(text)

          print("Internet permission added.")
          PY
          fi

          grep "android.permission.INTERNET" "$MANIFEST"

      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: assetflow_mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        working-directory: assetflow_mobile
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
