name: AssetFlow - Fix Dashboard Issue

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    name: Dashboard Fix + APK Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      # =========================================================
      # VERIFY PROJECT
      # =========================================================
      - name: Verify AssetFlow project
        working-directory: assetflow_mobile
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/core/api_client.dart
          test -f lib/screens/dashboard/dashboard_screen.dart

          echo "AssetFlow project verified."

      # =========================================================
      # ASSETS
      # =========================================================
      - name: Ensure assets directory exists
        working-directory: assetflow_mobile
        run: |
          set -e
          mkdir -p assets
          echo "assets/ verified."

      # =========================================================
      # DEPENDENCIES
      # =========================================================
      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: flutter pub get

      # =========================================================
      # REMOVE GENERATED TEST WHICH EXPECTS MyApp
      # =========================================================
      - name: Remove incompatible generated widget test
        working-directory: assetflow_mobile
        run: |
          set -e

          if [ -f test/widget_test.dart ]; then
            rm -f test/widget_test.dart
            echo "Removed generated widget_test.dart."
          else
            echo "No generated widget_test.dart found."
          fi

          mkdir -p test

      # =========================================================
      # DASHBOARD RETRY FIX
      # =========================================================
      - name: Apply Dashboard retry handling
        working-directory: assetflow_mobile
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          file = Path(
              "lib/screens/dashboard/dashboard_screen.dart"
          )

          text = file.read_text()

          # -----------------------------------------------------
          # Dashboard summary
          # -----------------------------------------------------
          old = """error: (err, _) => _ErrorTile(
                message: 'Could not load dashboard summary',
              ),"""

          new = """error: (err, _) => _ErrorTile(
                message: 'Could not load dashboard summary',
                onRetry: () {
                  ref.invalidate(dashboardSummaryProvider);
                },
              ),"""

          if old in text:
              text = text.replace(old, new, 1)
              print("Dashboard summary retry added.")
         
