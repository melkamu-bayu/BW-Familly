name: Fix Seeded Admin Email Domain
on:
  workflow_dispatch:
jobs:
  fix-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace reserved .local domain with .app
        run: |
          sed -i 's/admin@assetflow\.local/admin@assetflow.app/g' assetflow-backend/app/seed.py
          sed -i 's/admin@assetflow\.local/admin@assetflow.app/g' assetflow-backend/README.md
          grep -rn "assetflow\.app" assetflow-backend/app/seed.py assetflow-backend/README.md

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assetflow-backend/app/seed.py assetflow-backend/README.md
          git commit -m "Fix: .local is a reserved TLD that email-validator rejects; use .app instead" || echo "No changes"
          git push
