name: Fix Back Button - All Inner Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-buttons:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # ============================================================
      # 2. Install Flutter
      # ============================================================
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ============================================================
      # 3. Verify project
      # ============================================================
      - name: Verify Flutter project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/router.dart
          test -f lib/widgets/nav_shell.dart

          echo "Flutter project found."
          flutter --version

      # ============================================================
      # 4. Apply Back button to ALL authenticated inner pages
      # ============================================================
      - name: Apply complete inner-page Back-button fix
        working-directory: assetflow_mobile
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path("lib")

          GO_ROUTER_IMPORT = (
              "import 'package:go_router/go_router.dart';"
          )

          # ==========================================================
          # These are the ONLY pages that must receive Back buttons.
          #
          # Login is intentionally excluded.
          # Dashboard is intentionally excluded.
          # ==========================================================

          pages = {
              "assets": (
                  ROOT / "screens/assets/assets_hub_screen.dart",
                  "/dashboard",
              ),

              "vehicles": (
                  ROOT / "screens/vehicles/vehicles_list_screen.dart",
                  "/assets",
              ),

              "vehicle_detail": (
                  ROOT / "screens/vehicles/vehicle_detail_screen.dart",
                  "/vehicles",
              ),

              "notifications": (
                  ROOT / "screens/notifications/notifications_screen.dart",
                  "/dashboard",
              ),

              "settings": (
                  ROOT / "screens/settings/settings_screen.dart",
                  "/dashboard",
              ),

              "properties": (
                  ROOT / "screens/properties/properties_list_screen.dart",
                  "/assets",
              ),

              "property_detail": (
                  ROOT / "screens/properties/property_detail_screen.dart",
                  "/properties",
              ),

              "shop": (
                  ROOT / "screens/shop/shop_screen.dart",
                  "/assets",
              ),

              "gold_project": (
                  ROOT / "screens/projects/gold_project_screen.dart",
                  "/assets",
              ),

              "accounts": (
                  ROOT / "screens/accounts/accounts_screen.dart",
                  "/assets",
              ),

              "reports": (
                  ROOT / "screens/reports/reports_screen.dart",
                  "/dashboard",
              ),
          }

          # ==========================================================
          # Helpers
          # ==========================================================

          def read(path):
              return path.read_text(encoding="utf-8")

          def write(path, text):
              path.write_text(text, encoding="utf-8")

          def add_import(path):
              text = read(path)

              if GO_ROUTER_IMPORT in text:
                  return

              lines = text.splitlines()

              last_package = -1

              for i, line in enumerate(lines):
                  if line.startswith("import 'package:"):
                      last_package = i

              if last_package >= 0:
                  lines.insert(
                      last_package + 1,
                      GO_ROUTER_IMPORT
                  )
              else:
                  lines.insert(
                      0,
                      GO_ROUTER_IMPORT
                  )

              write(
                  path,
                  "\n".join(lines) + "\n"
              )

          def has_back_button(text):
              return (
                  "tooltip: 'Back'" in text
                  and "context.canPop()" in text
                  and "context.pop()" in text
              )

          def find_appbar(text):
              match = re.search(
                  r"\bappBar\s*:\s*AppBar\s*\(",
                  text
              )

              if not match:
                  return None

              open_pos = text.find(
                  "(",
                  match.start()
              )

              depth = 0
              in_string = False
              string_char = None
              escape = False

              for i in range(
                  open_pos,
                  len(text)
              ):
                  c = text[i]

                  if in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == string_char:
                          in_string = False
                      continue

                  if c in ("'", '"'):
                      in_string = True
                      string_char = c
                      continue

                  if c == "(":
                      depth += 1

                  elif c == ")":
                      depth -= 1

                      if depth == 0:
                          end = i + 1

                          if (
                              end < len(text)
                              and text[end] == ","
                          ):
                              end += 1

                          return (
                              match.start(),
                              end
                          )

              return None

          def add_back_button(path, fallback):
              text = read(path)

              if has_back_button(text):
                  return False

              appbar = find_appbar(text)

              if not appbar:
                  raise RuntimeError(
                      f"Could not find AppBar in {path}. "
                      "The workflow stopped to prevent an incomplete fix."
                  )

              start, end = appbar
              block = text[start:end]

              # Never overwrite an existing custom leading widget.
              if re.search(
                  r"\bleading\s*:",
                  block
              ):
                  raise RuntimeError(
                      f"{path} already contains a custom leading widget. "
                      "Manual review required."
                  )

              line_start = text.rfind(
                  "\n",
                  0,
                  start
              ) + 1

              indent = text[
                  line_start:start
              ]

              child_indent = indent + "  "
              body_indent = indent + "    "

              open_paren = block.find("(")
              close_paren = block.rfind(")")

              inner = block[
                  open_paren + 1:
                  close_paren
              ].strip()

              new_block = (
                  f"{indent}appBar: AppBar(\n"
                  f"{child_indent}leading: IconButton(\n"
                  f"{body_indent}icon: const "
                  f"Icon(Icons.arrow_back_rounded),\n"
                  f"{body_indent}tooltip: 'Back',\n"
                  f"{body_indent}onPressed: () {{\n"
                  f"{body_indent}  if (context.canPop()) {{\n"
                  f"{body_indent}    context.pop();\n"
                  f"{body_indent}  }} else {{\n"
                  f"{body_indent}    context.go('{fallback}');\n"
                  f"{body_indent}  }}\n"
                  f"{body_indent}}},\n"
                  f"{child_indent}),\n"
              )

              if inner:
                  new_block += (
                      f"{indent}  {inner}\n"
                  )

              new_block += (
                  f"{indent}),"
              )

              write(
                  path,
                  text[:start]
                  + new_block
                  + text[end:]
              )

              return True

          # ==========================================================
          # Verify router structure
          # ==========================================================

          router = ROOT / "router.dart"
          router_text = read(router)

          if "initialLocation: '/dashboard'" not in router_text:
              raise RuntimeError(
                  "Dashboard is not configured as initialLocation."
              )

          # Login must remain outside authenticated ShellRoute.
          if "GoRoute(path: '/login'" not in router_text:
              raise RuntimeError(
                  "Expected /login route was not found."
              )

          # ==========================================================
          # Verify every expected source file exists
          # ==========================================================

          print("")
          print("Checking all authenticated inner pages...")
          print("")

          for name, (path, fallback) in pages.items():
              if not path.exists():
                  raise RuntimeError(
                      f"Required page does not exist: {path}"
                  )

              print(
                  f"FOUND: {name} -> {path}"
              )

          print("")

          # ==========================================================
          # Protect Dashboard
          # ==========================================================

          dashboard = (
              ROOT
              / "screens/dashboard/dashboard_screen.dart"
          )

          dashboard_text = read(dashboard)

          if has_back_button(dashboard_text):
              raise RuntimeError(
                  "Dashboard already contains a Back button. "
                  "Dashboard must remain the root page."
              )

          print(
              "Dashboard protected: NO Back button."
          )

          # ==========================================================
          # Protect Login
          # ==========================================================

          login = (
              ROOT
              / "screens/auth/login_screen.dart"
          )

          if login.exists():
              login_text = read(login)

              if has_back_button(login_text):
                  raise RuntimeError(
                      "Login contains a Back button. "
                      "Login must remain the authentication entry page."
                  )

              print(
                  "Login protected: NO Back button."
              )

          # ==========================================================
          # Apply Back buttons to every inner page
          # ==========================================================

          changed = []
          already_fixed = []

          for name, (path, fallback) in pages.items():

              add_import(path)

              if add_back_button(
                  path,
                  fallback
              ):
                  changed.append(str(path))
              else:
                  already_fixed.append(str(path))

          # ==========================================================
          # Convert inner navigation from go() to push()
          # ==========================================================

          navigation_files = [
              ROOT / "screens/assets/assets_hub_screen.dart",
              ROOT / "screens/settings/settings_screen.dart",
          ]

          routes_to_push = [
              "/assets",
              "/vehicles",
              "/vehicles/",
              "/properties",
              "/properties/",
              "/notifications",
              "/settings",
              "/shop",
              "/gold-project",
              "/accounts",
              "/reports",
          ]

          for path in navigation_files:

              if not path.exists():
                  continue

              text = read(path)
              original = text

              for route in routes_to_push:

                  text = text.replace(
                      f"context.go('{route}')",
                      f"context.push('{route}')"
                  )

                  text = text.replace(
                      f'context.go("{route}")',
                      f'context.push("{route}")'
                  )

              if text != original:
                  write(path, text)

          # ==========================================================
          # Report
          # ==========================================================

          print("")
          print("========================================")
          print("BACK-BUTTON FIX COMPLETED")
          print("========================================")
          print("")

          print("Changed pages:")
          for item in changed:
              print(f"  + {item}")

          print("")
          print("Already correct:")
          for item in already_fixed:
              print(f"  = {item}")

          print("")
          print(
              f"Total authenticated inner pages checked: "
              f"{len(pages)}"
          )

      # ============================================================
      # 5. Verify ALL inner pages
      # ============================================================
      - name: Verify every inner page
        working-directory: assetflow_mobile
        shell: python
        run: |
          from pathlib import Path

          pages = [
              Path("lib/screens/assets/assets_hub_screen.dart"),
              Path("lib/screens/vehicles/vehicles_list_screen.dart"),
              Path("lib/screens/vehicles/vehicle_detail_screen.dart"),
              Path("lib/screens/notifications/notifications_screen.dart"),
              Path("lib/screens/settings/settings_screen.dart"),
              Path("lib/screens/properties/properties_list_screen.dart"),
              Path("lib/screens/properties/property_detail_screen.dart"),
              Path("lib/screens/shop/shop_screen.dart"),
              Path("lib/screens/projects/gold_project_screen.dart"),
              Path("lib/screens/accounts/accounts_screen.dart"),
              Path("lib/screens/reports/reports_screen.dart"),
          ]

          failures = []

          for path in pages:

              if not path.exists():
                  failures.append(
                      f"{path}: file missing"
                  )
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              if "tooltip: 'Back'" not in text:
                  failures.append(
                      f"{path}: Back button missing"
                  )

              if "context.canPop()" not in text:
                  failures.append(
                      f"{path}: context.canPop() missing"
                  )

              if "context.pop()" not in text:
                  failures.append(
                      f"{path}: context.pop() missing"
                  )

          if failures:
              print(
                  "ERROR: Inner-page verification failed:"
              )

              for item in failures:
                  print(f"  - {item}")

              raise SystemExit(1)

          print(
              "SUCCESS: ALL 11 authenticated inner pages "
              "have Back buttons."
          )

      # ============================================================
      # 6. Verify Dashboard and Login remain without Back
      # ============================================================
      - name: Verify root and authentication pages
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          if grep -q "tooltip: 'Back'" \
            lib/screens/dashboard/dashboard_screen.dart; then
            echo "ERROR: Dashboard has Back."
            exit 1
          fi

          if grep -q "tooltip: 'Back'" \
            lib/screens/auth/login_screen.dart; then
            echo "ERROR: Login has Back."
            exit 1
          fi

          grep -q \
            "initialLocation: '/dashboard'" \
            lib/router.dart

          echo "Dashboard/Login protection verified."

      # ============================================================
      # 7. Verify NavShell
      # ============================================================
      - name: Verify NavShell
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          if grep -q "PopScope" \
            lib/widgets/nav_shell.dart; then
            echo "ERROR: PopScope found in NavShell."
            exit 1
          fi

          echo "NavShell protection verified."

      # ============================================================
      # 8. Verify navigation stack
      # ============================================================
      - name: Verify push navigation
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          echo "Checking inner-page navigation..."

          if grep -q "context.go('/vehicles')" \
            lib/screens/assets/assets_hub_screen.dart; then
            echo "ERROR: Assets -> Vehicles still uses go()."
            exit 1
          fi

          if grep -q "context.go('/properties')" \
            lib/screens/assets/assets_hub_screen.dart; then
            echo "ERROR: Assets -> Properties still uses go()."
            exit 1
          fi

          if grep -q "context.go('/shop')" \
            lib/screens/assets/assets_hub_screen.dart; then
            echo "ERROR: Assets -> Shop still uses go()."
            exit 1
          fi

          if grep -q "context.go('/gold-project')" \
            lib/screens/assets/assets_hub_screen.dart; then
            echo "ERROR: Assets -> Gold Project still uses go()."
            exit 1
          fi

          if grep -q "context.go('/accounts')" \
            lib/screens/assets/assets_hub_screen.dart; then
            echo "ERROR: Assets -> Accounts still uses go()."
            exit 1
          fi

          if grep -q "context.go('/reports')" \
            lib/screens/assets/assets_hub_screen.dart; then
            echo "ERROR: Assets -> Reports still uses go()."
            exit 1
          fi

          echo "Navigation stack verification passed."

      # ============================================================
      # 9. Format
      # ============================================================
      - name: Format Dart files
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          dart format lib

      # ============================================================
      # 10. Dependencies
      # ============================================================
      - name: Get dependencies
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter pub get

      # ============================================================
      # 11. Analyze
      # ============================================================
      - name: Run Flutter analyze
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter analyze

      # ============================================================
      # 12. Show changes
      # ============================================================
      - name: Show changed files
        run: |
          set -euo pipefail

          git status --short

          echo ""
          echo "Diff:"
          git diff --stat

      # ============================================================
      # 13. Commit and push
      # ============================================================
      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes were necessary."
            exit 0
          fi

          git add assetflow_mobile/lib

          git commit \
            -m "Fix back navigation for all inner pages"

          git push origin master
