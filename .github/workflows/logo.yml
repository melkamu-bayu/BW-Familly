name: Update AssetFlow Logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AssetFlow project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -d assets

          echo "AssetFlow project verified."

      - name: Verify new logo exists
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          test -f assets/new_assetflow_logo.png

          echo "New AssetFlow logo found:"
          ls -lh assets/new_assetflow_logo.png

      - name: Replace AssetFlow application logo
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          cp assets/new_assetflow_logo.png assets/assetflow_logo.png

          echo "Logo replaced successfully:"
          ls -lh assets/assetflow_logo.png

      - name: Remove temporary logo file
        working-directory: assetflow_mobile
        run: |
          rm -f assets/new_assetflow_logo.png

      - name: Commit updated logo
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/assets/assetflow_logo.png

          if git diff --cached --quiet; then
            echo "No logo changes detected."
          else
            git commit -m "Update AssetFlow application logo"
            git push
          fi
