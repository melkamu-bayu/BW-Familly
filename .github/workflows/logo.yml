name: Update AssetFlow Logo

on:
  workflow_dispatch:
  push:
    paths:
      - "assetflow_mobile/assets/assetflow_logo2.png"

permissions:
  contents: write

jobs:
  update-logo:
    name: Update AssetFlow Logo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify new logo
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          LOGO="assets/assetflow_logo2.png"

          if [ ! -f "$LOGO" ]; then
            echo "ERROR: New logo not found: $LOGO"
            exit 1
          fi

          echo "New AssetFlow logo found:"
          ls -lh "$LOGO"

      - name: Replace current AssetFlow logo
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          cp assets/assetflow_logo2.png assets/assetflow_logo.png

          echo "Logo successfully replaced."
          ls -lh assets/assetflow_logo.png

      - name: Verify Flutter asset configuration
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          if ! grep -qE '^[[:space:]]*-[[:space:]]*assets/' pubspec.yaml; then
            echo "ERROR: pubspec.yaml does not include the assets directory."
            exit 1
          fi

          echo "Flutter assets configuration verified."

      - name: Remove temporary logo
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          rm -f assets/assetflow_logo2.png

          echo "Temporary logo removed."

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
            git diff --stat
          fi

      - name: Commit updated logo
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/assets/assetflow_logo.png

          git commit -m "Update AssetFlow logo"

          git push
