name: Add Startup Migration Script
on:
  workflow_dispatch:
jobs:
  add-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write entrypoint.sh
        run: |
          cat > assetflow-backend/entrypoint.sh << 'SCRIPT_EOF'
          #!/bin/sh
          # Runs on every container start (Render free tier has no Shell/one-off-job
          # access, so this is how migrations and seeding happen instead of a manual
          # `alembic upgrade head` / `python -m app.seed` in a shell).
          #
          # Safe to run on every boot:
          #   - `alembic upgrade head` is a no-op if the schema is already current.
          #   - `app.seed` checks for existing rows before creating anything, so it
          #     never duplicates data on a restart/redeploy.
          set -e

          echo "== Running database migrations =="
          alembic upgrade head

          echo "== Seeding initial data (idempotent) =="
          python -m app.seed

          echo "== Starting server =="
          exec uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-8000}"
          SCRIPT_EOF
          chmod +x assetflow-backend/entrypoint.sh

      - name: Update Dockerfile to use entrypoint.sh
        run: |
          cat > assetflow-backend/Dockerfile << 'DOCKER_EOF'
          FROM python:3.12-slim

          WORKDIR /code

          RUN apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev && rm -rf /var/lib/apt/lists/*

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY . .

          RUN chmod +x entrypoint.sh

          EXPOSE 8000

          # entrypoint.sh runs migrations + idempotent seeding before starting uvicorn --
          # necessary on platforms like Render's free tier that don't offer shell/
          # one-off-job access to run these manually. Local docker-compose overrides
          # this with its own `command:`, so this only takes effect on the deployed image.
          CMD ["./entrypoint.sh"]
          DOCKER_EOF

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assetflow-backend/entrypoint.sh assetflow-backend/Dockerfile
          git commit -m "Auto-run migrations + seed on container startup (Render free tier has no Shell access)" || echo "No changes"
          git push
