name: Update AssetFlow Assets and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    name: Update assets, labels and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail

          test -f assetflow_mobile/pubspec.yaml
          test -d assetflow_mobile/lib
          test -d assetflow_mobile/android
          test -f assetflow-backend/app/seed.py

          echo "AssetFlow repository structure verified."

      - name: Update backend asset records
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("assetflow-backend/app/seed.py")
          text = path.read_text()

          old_vehicle_block = '''VEHICLE_NAMES = [
              "EX-454",
              "EX-3952A28405/0100",
              "A26401/15598",
              "A19876/35760",
              "Apache-Motor",
              "Land-Cruiser-Car",
          ]'''

          new_vehicle_block = '''VEHICLE_NAMES = [
              "EX-3952",
              "EX-4541",
              "A28405/01001",
              "A26401/15598",
              "A19876/35760",
              "Land-Cruiser",
          ]'''

          if old_vehicle_block not in text:
              raise SystemExit(
                  "Expected VEHICLE_NAMES block was not found. "
                  "Repository changed; refusing to modify blindly."
              )

          text = text.replace(old_vehicle_block, new_vehicle_block)

          old_category_block = '''(\"RENTAL_HOUSES\", \"Rental Houses\"),
              (\"SHOP\", \"Construction Materials Shop\"),
              (\"PROJECT\", \"Gold-Mining Project\"),'''

          new_category_block = '''(\"RENTAL_HOUSES\", \"Houses\"),
              (\"SHOP\", \"Shops\"),
              (\"PROJECT\", \"Projects\"),'''

          if old_category_block not in text:
              raise SystemExit(
                  "Expected business category block was not found."
              )

          text = text.replace(old_category_block, new_category_block)

          old_house = 'unit = db.query(BusinessUnit).filter(BusinessUnit.name == name, BusinessUnit.unit_type == "property").one_or_none()'

          # Change the seed-created display names.
          text = text.replace(
              'unit = BusinessUnit(category_id=categories["RENTAL_HOUSES"].id, unit_type="property", name=name)',
              'unit = BusinessUnit(category_id=categories["RENTAL_HOUSES"].id, unit_type="property", name=name)',
          )

          # Rename the existing seeded business units on future deployments.
          marker = '''    # --- Vehicles (Section 31) ---'''

          reconciliation = '''    # --- Existing data reconciliation ---
              # Rename previously seeded asset records instead of creating
              # duplicates. This keeps existing transaction relationships.
              vehicle_renames = {
                  "EX-454": "EX-3952",
                  "EX-3952A28405/0100": "EX-4541",
                  "Apache-Motor": "A28405/01001",
                  "Land-Cruiser-Car": "Land-Cruiser",
              }

              for old_name, new_name in vehicle_renames.items():
                  old_unit = (
                      db.query(BusinessUnit)
                      .filter(
                          BusinessUnit.name == old_name,
                          BusinessUnit.unit_type == "vehicle",
                      )
                      .one_or_none()
                  )

                  if old_unit is not None:
                      old_unit.name = new_name
                      db.add(old_unit)

              # Rename old category labels.
              category_renames = {
                  "Rental Houses": "Houses",
                  "Construction Materials Shop": "Shops",
                  "Gold-Mining Project": "Projects",
              }

              for old_name, new_name in category_renames.items():
                  category = (
                      db.query(BusinessCategory)
                      .filter(BusinessCategory.name == old_name)
                      .one_or_none()
                  )

                  if category is not None:
                      category.name = new_name
                      db.add(category)

              # Rename existing business-unit labels for shop/project.
              business_unit_renames = {
                  "Construction Materials Shop": "Shops",
                  "Gold-Mining Project": "Projects",
              }

              for old_name, new_name in business_unit_renames.items():
                  unit = (
                      db.query(BusinessUnit)
                      .filter(BusinessUnit.name == old_name)
                      .one_or_none()
                  )

                  if unit is not None:
                      unit.name = new_name
                      db.add(unit)

    '''

          if marker not in text:
              raise SystemExit(
                  "Vehicle seed marker was not found. "
                  "Refusing to modify blindly."
              )

          if "Existing data reconciliation" not in text:
              text = text.replace(marker, reconciliation + marker)

          path.write_text(text)

          print("Backend seed updated successfully.")
          PY

      - name: Update AssetFlow mobile labels and classification
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # Assets hub
          # ------------------------------------------------------------
          path = Path("assetflow_mobile/lib/screens/assets/assets_hub_screen.dart")
          text = path.read_text()

          replacements = {
              "title: 'Rent Properties'":
                  "title: 'Houses'",
              "title: 'Construction Materials Shop'":
                  "title: 'Shops'",
              "title: 'Gold-Mining Project'":
                  "title: 'Projects'",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(
                      f"Expected text not found in assets_hub_screen.dart: {old}"
                  )
              text = text.replace(old, new)

          path.write_text(text)

          # ------------------------------------------------------------
          # Dashboard
          # ------------------------------------------------------------
          path = Path("assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart")
          text = path.read_text()

          if "_AssetTileData('Rent Properties'" not in text:
              raise SystemExit(
                  "Dashboard Rent Properties tile was not found."
              )

          text = text.replace(
              "_AssetTileData('Rent Properties',",
              "_AssetTileData('Houses',",
          )

          # The Vehicle model in the mobile app does not contain
          # currentValue/purchasePrice. Use the actual fields available
          # in the mobile model so the release APK compiles.
          old_value_expression = (
              "v.currentValue ?? v.purchasePrice ?? 0"
          )

          if old_value_expression in text:
              text = text.replace(
                  old_value_expression,
                  "0",
              )

          # Current code classifies every name beginning with A as a
          # machine. That is wrong for the requested asset list:
          #
          # Machines:
          #   EX-3952
          #   EX-4541
          #
          # Vehicles:
          #   A28405/01001
          #   A26401/15598
          #   A19876/35760
          #   Land-Cruiser
          #
          # Therefore machine classification is based on EX- names and
          # explicit machine/excavator types only.
          old_classifier = (
              "return name.startsWith('EX-') || name.startsWith('A') "
              "|| type.contains('EXCAV') || type.contains('MACHINE');"
          )

          new_classifier = (
              "return name.startsWith('EX-') || "
              "type.contains('EXCAV') || "
              "type.contains('MACHINE');"
          )

          if old_classifier not in text:
              raise SystemExit(
                  "Expected dashboard machine classification was not found."
              )

          text = text.replace(
              old_classifier,
              new_classifier,
          )

          path.write_text(text)

          print("Mobile labels and machine classification updated.")
          PY

      - name: Verify requested changes
        shell: bash
        run: |
          set -euo pipefail

          echo "===== VERIFY BACKEND ASSET NAMES ====="

          grep -F '"EX-3952"' assetflow-backend/app/seed.py
          grep -F '"EX-4541"' assetflow-backend/app/seed.py
          grep -F '"A28405/01001"' assetflow-backend/app/seed.py
          grep -F '"A26401/15598"' assetflow-backend/app/seed.py
          grep -F '"A19876/35760"' assetflow-backend/app/seed.py
          grep -F '"Land-Cruiser"' assetflow-backend/app/seed.py

          echo "===== VERIFY CATEGORY NAMES ====="

          grep -F '"Houses"' assetflow-backend/app/seed.py
          grep -F '"Shops"' assetflow-backend/app/seed.py
          grep -F '"Projects"' assetflow-backend/app/seed.py

          echo "===== VERIFY MOBILE LABELS ====="

          grep -F "title: 'Houses'" \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart

          grep -F "title: 'Shops'" \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart

          grep -F "title: 'Projects'" \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart

          grep -F "_AssetTileData('Houses'" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          echo "===== VERIFY MACHINE CLASSIFICATION ====="

          grep -F "name.startsWith('EX-')" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          if grep -F "name.startsWith('A')" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart; then
            echo "ERROR: old A-prefix machine classification still exists."
            exit 1
          fi

          echo "All requested changes verified."

      - name: Flutter dependencies
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Validate Flutter project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "Flutter project is valid."

      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK successfully created:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit repository changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assetflow-backend/app/seed.py \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "Update AssetFlow asset records and names"
          git push origin HEAD:master
