name: AssetFlow Asset Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    name: Update AssetFlow Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f assetflow-backend/app/seed.py
          test -f assetflow_mobile/pubspec.yaml
          test -f assetflow_mobile/lib/screens/assets/assets_hub_screen.dart
          test -f assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          echo "AssetFlow project verified."

      - name: Update backend seed data
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          p = Path("assetflow-backend/app/seed.py")
          s = p.read_text()

          replacements = {
              "\"EX-454\"": "\"EX-3952\"",
              "\"EX-3952A28405/0100\"": "\"EX-4541\"",
              "\"Apache-Motor\"": "\"A28405/01001\"",
              "\"Land-Cruiser-Car\"": "\"Land-Cruiser\"",
              "(\"RENTAL_HOUSES\", \"Rental Houses\")": "(\"RENTAL_HOUSES\", \"Houses\")",
              "(\"SHOP\", \"Construction Materials Shop\")": "(\"SHOP\", \"Shops\")",
              "(\"PROJECT\", \"Gold-Mining Project\")": "(\"PROJECT\", \"Projects\")",
              "name=\"Construction Materials Shop\"": "name=\"Shops\"",
              "name=\"Gold-Mining Project\"": "name=\"Projects\""
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit("Expected backend text not found: " + old)
              s = s.replace(old, new)

          p.write_text(s)
          print("Backend seed updated.")
          '

      - name: Update mobile asset names
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          p = Path("assetflow_mobile/lib/screens/assets/assets_hub_screen.dart")
          s = p.read_text()

          replacements = {
              "title: '\''Rent Properties'\''": "title: '\''Houses'\''",
              "title: '\''Construction Materials Shop'\''": "title: '\''Shops'\''",
              "title: '\''Gold-Mining Project'\''": "title: '\''Projects'\''"
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit("Expected mobile text not found: " + old)
              s = s.replace(old, new)

          p.write_text(s)
          print("Mobile Assets page updated.")
          '

      - name: Update dashboard name
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          p = Path("assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart")
          s = p.read_text()

          old = "_AssetTileData('\''Rent Properties'\'',"
          new = "_AssetTileData('\''Houses'\'',"

          if old not in s:
              raise SystemExit("Dashboard Rent Properties label was not found.")

          s = s.replace(old, new)
          p.write_text(s)

          print("Dashboard updated.")
          '

      - name: Update machine classification
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          p = Path("assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart")
          s = p.read_text()

          old = "return name.startsWith('\''EX-'\'') || name.startsWith('\''A'\'') || type.contains('\''EXCAV'\'') || type.contains('\''MACHINE'\'');"

          new = "return name.startsWith('\''EX-'\'') || type.contains('\''EXCAV'\'') || type.contains('\''MACHINE'\'');"

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("Machine classification corrected.")
          else:
              print("Machine classification already corrected.")
          '

      - name: Verify changes
        shell: bash
        run: |
          set -e

          echo "===== BACKEND ====="

          grep -F '"EX-3952"' assetflow-backend/app/seed.py
          grep -F '"EX-4541"' assetflow-backend/app/seed.py
          grep -F '"A28405/01001"' assetflow-backend/app/seed.py
          grep -F '"A26401/15598"' assetflow-backend/app/seed.py
          grep -F '"A19876/35760"' assetflow-backend/app/seed.py
          grep -F '"Land-Cruiser"' assetflow-backend/app/seed.py

          grep -F '"Houses"' assetflow-backend/app/seed.py
          grep -F '"Shops"' assetflow-backend/app/seed.py
          grep -F '"Projects"' assetflow-backend/app/seed.py

          echo "===== MOBILE ASSETS ====="

          grep -F "title: 'Houses'" \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart

          grep -F "title: 'Shops'" \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart

          grep -F "title: 'Projects'" \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart

          echo "===== DASHBOARD ====="

          grep -F "_AssetTileData('Houses'" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          echo "All requested source changes verified."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Build APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK BUILD SUCCESSFUL"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit source changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assetflow-backend/app/seed.py \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Update AssetFlow asset names and records"
          git push
