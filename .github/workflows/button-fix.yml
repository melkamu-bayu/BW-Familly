name: AssetFlow - Fix All Child Page Back Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-buttons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Verify project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/router.dart
          test -f lib/models/models.dart
          test -d lib/screens
          echo "Project OK."

      - name: Verify dashboard route
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail
          grep -q "initialLocation: '/dashboard'" lib/router.dart
          echo "Dashboard route OK."

      - name: Inspect NavShell
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail
          if grep -q "PopScope" lib/widgets/nav_shell.dart; then
            echo "PopScope exists in NavShell. Leaving NavShell unchanged."
          fi

      - name: Fix Vehicle model
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          python3 -c '
          from pathlib import Path

          p = Path("lib/models/models.dart")
          s = p.read_text()

          if "final double? currentValue;" not in s:
              old = """  final double mileage;
            final String status;"""
              new = """  final double mileage;
            final String status;
            final double? currentValue;
            final double? purchasePrice;"""
              if old not in s:
                  raise SystemExit("Vehicle fields not found")
              s = s.replace(old, new, 1)

          if "this.currentValue" not in s:
              old = """    required this.mileage,
            required this.status,
          });"""
              new = """    required this.mileage,
            required this.status,
            this.currentValue,
            this.purchasePrice,
          });"""
              if old not in s:
                  raise SystemExit("Vehicle constructor not found")
              s = s.replace(old, new, 1)

          if "currentValue: (json[\"current_value\"]" not in s:
              old = """        mileage: (json["mileage"] as num).toDouble(),
            status: json["status"] as String,"""
              new = """        mileage: (json["mileage"] as num).toDouble(),
            status: json["status"] as String,
            currentValue: (json["current_value"] as num?)?.toDouble(),
            purchasePrice: (json["purchase_price"] as num?)?.toDouble(),"""
              if old in s:
                  s = s.replace(old, new, 1)

          p.write_text(s)
          print("Vehicle model checked.")
          '

      - name: Add Back buttons
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          python3 -c '
          from pathlib import Path
          import re

          root = Path("lib/screens")

          excluded = {
              "dashboard",
              "auth",
              "login",
              "splash",
          }

          imp = "import '\''package:go_router/go_router.dart'\'';"

          for p in sorted(root.rglob("*.dart")):

              rel = p.relative_to(root)

              if any(x in excluded for x in rel.parts[:-1]):
                  continue

              s = p.read_text()

              if "AppBar(" not in s:
                  continue

              if "leading:" in s:
                  continue

              if imp not in s:
                  imports = list(
                      re.finditer(
                          r"^import .*;$",
                          s,
                          re.MULTILINE
                      )
                  )

                  if imports:
                      pos = imports[-1].end()
                      s = (
                          s[:pos]
                          + "\n"
                          + imp
                          + s[pos:]
                      )
                  else:
                      s = imp + "\n" + s

              s = s.replace(
                  "AppBar(",
                  """AppBar(
            leading: IconButton(
              icon: const Icon(Icons.arrow_back_rounded),
              tooltip: "Back",
              onPressed: () {
                if (context.canPop()) {
                  context.pop();
                } else {
                  context.go("/dashboard");
                }
              },
            ),""",
                  1
              )

              p.write_text(s)

              print("Updated:", p)
          '

      - name: Verify Back buttons
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          python3 -c '
          from pathlib import Path
          import sys

          root = Path("lib/screens")

          excluded = {
              "dashboard",
              "auth",
              "login",
              "splash",
          }

          errors = []

          for p in sorted(root.rglob("*.dart")):

              rel = p.relative_to(root)

              if any(x in excluded for x in rel.parts[:-1]):
                  continue

              s = p.read_text()

              if "AppBar(" not in s:
                  continue

              if "leading:" not in s:
                  errors.append(f"{p}: missing leading")

              if "context.canPop()" not in s:
                  errors.append(f"{p}: missing canPop")

              if "context.pop()" not in s:
                  errors.append(f"{p}: missing pop")

          if errors:
              print("Back-button verification failed:")
              for e in errors:
                  print(e)
              sys.exit(1)

          print("All detected inner AppBars have Back handling.")
          '

      - name: Format
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail
          dart format lib

      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail
          flutter pub get

      - name: Flutter analyze
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail
          flutter analyze

      - name: Verify NavShell unchanged
        run: |
          set -euo pipefail

          if git diff --name-only | grep -q "assetflow_mobile/lib/widgets/nav_shell.dart"; then
            echo "ERROR: NavShell was modified."
            exit 1
          fi

          echo "NavShell unchanged."

      - name: Show changes
        run: |
          set -euo pipefail
          git status --short
          git diff --stat

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi

          git add assetflow_mobile/lib/screens
          git add assetflow_mobile/lib/models/models.dart

          git commit -m "Fix Back buttons on all AssetFlow child pages"
          git push origin master
