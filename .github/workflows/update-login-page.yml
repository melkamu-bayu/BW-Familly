name: AssetFlow Login Page Update

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: assetflow_mobile
  FLUTTER_VERSION: "3.35.7"
  API_BASE_URL: "https://assetflow-api-f435.onrender.com/api/v1"

jobs:
  build:
    name: Build AssetFlow Release APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. FLUTTER
      # ----------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ----------------------------------------------------------
      # 3. JAVA
      # ----------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ----------------------------------------------------------
      # 4. VERIFY REAL ASSETFLOW PROJECT
      # ----------------------------------------------------------
      - name: Verify AssetFlow project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          test -f lib/screens/auth/login_screen.dart
          test -f assets/assetflow_logo.png

          echo "======================================"
          echo "AssetFlow project verified"
          echo "======================================"

          echo "Flutter project:"
          pwd

          echo "Login page:"
          ls -lh lib/screens/auth/login_screen.dart

          echo "Logo:"
          ls -lh assets/assetflow_logo.png

      # ----------------------------------------------------------
      # 5. GENERATE ANDROID PROJECT
      #
      # The repository currently does not contain android/.
      # Flutter generates the Android Gradle project here.
      # ----------------------------------------------------------
      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter create \
            --platforms=android \
            --project-name assetflow_mobile \
            .

          test -d android
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Android project generated successfully."

      # ----------------------------------------------------------
      # 6. MAKE SURE LOGO IS USED BY LOGIN PAGE
      # ----------------------------------------------------------
      - name: Verify login logo
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          grep -q "assets/assetflow_logo.png" \
            lib/screens/auth/login_screen.dart

          grep -q "assets/" pubspec.yaml

          echo "AssetFlow login logo configuration verified."

      # ----------------------------------------------------------
      # 7. FORMAT
      # ----------------------------------------------------------
      - name: Format Dart code
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          dart format \
            lib/screens/auth/login_screen.dart

      # ----------------------------------------------------------
      # 8. DEPENDENCIES
      # ----------------------------------------------------------
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ----------------------------------------------------------
      # 9. ANALYZE
      #
      # Existing infos/warnings do not stop the build.
      # Real Dart compile errors still stop the workflow.
      # ----------------------------------------------------------
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ----------------------------------------------------------
      # 10. BUILD APK
      #
      # NO RENDER CURL / HEALTH CHECK HERE.
      # The APK only needs the API URL as a compile-time value.
      # ----------------------------------------------------------
      - name: Build AssetFlow Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      # ----------------------------------------------------------
      # 11. VERIFY APK
      # ----------------------------------------------------------
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "======================================"
          echo "ASSETFLOW APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      # ----------------------------------------------------------
      # 12. UPLOAD APK
      # ----------------------------------------------------------
      - name: Upload AssetFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-login-release
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ----------------------------------------------------------
      # 13. COMMIT GENERATED ANDROID PROJECT
      #
      # This makes the generated Android project permanent in GitHub.
      # ----------------------------------------------------------
      - name: Commit Android project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/android

          if git diff --cached --quiet; then
            echo "No Android project changes to commit."
          else
            git commit -m "Add Android build project for AssetFlow"
            git push
          fi
