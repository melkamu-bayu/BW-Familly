name: Build AssetFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check Render API
        run: |
          set -e

          API_URL="https://assetflow-api-f435.onrender.com/api/v1"
          DOCS_URL="https://assetflow-api-f435.onrender.com/docs"

          echo "Testing backend:"
          echo "$API_URL"

          HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$DOCS_URL")

          echo "Render API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Render API is not reachable."
            exit 1
          fi

          echo "Render API is reachable."

      - name: Check Flutter project
        working-directory: assetflow_mobile
        run: |
          set -e

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Flutter project found."
          pwd
          ls -la

      - name: Create Android project
        working-directory: assetflow_mobile
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android folder does not exist."
            echo "Creating Android project..."
            flutter create .
          else
            echo "Android folder already exists."
          fi

      - name: Configure Android Internet permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            echo "Expected:"
            echo "$MANIFEST"
            exit 1
          fi

          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "Internet permission already exists."
          else
            python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET"/>\n'

          start = text.find("<manifest")

          if start == -1:
              raise SystemExit("ERROR: <manifest> tag not found.")

          end = text.find(">", start)

          if end == -1:
              raise SystemExit("ERROR: Invalid AndroidManifest.xml")

          text = text[:end + 1] + "\n" + permission + text[end + 1:]

          manifest.write_text(text)

          print("Internet permission added.")
          PY
          fi

          echo "Checking Internet permission..."
          grep "android.permission.INTERNET" "$MANIFEST"

      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: |
          set -e
          flutter pub get

      - name: Check API configuration
        working-directory: assetflow_mobile
        run: |
          set -e

          echo "Checking API configuration files..."

          if [ -f "lib/core/config.dart" ]; then
            echo "config.dart found."
          else
            echo "WARNING: lib/core/config.dart not found."
          fi

          if [ -f "lib/core/api_client.dart" ]; then
            echo "api_client.dart found."
          else
            echo "WARNING: lib/core/api_client.dart not found."
          fi

      - name: Build release APK
        working-directory: assetflow_mobile
        run: |
          set -e

          API_BASE_URL="https://assetflow-api-f435.onrender.com/api/v1"

          echo "======================================"
          echo "Building AssetFlow Release APK"
          echo "======================================"
          echo "API_BASE_URL:"
          echo "$API_BASE_URL"
          echo "======================================"

          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify APK
        working-directory: assetflow_mobile
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
