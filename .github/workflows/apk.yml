name: AssetFlow APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Verify Flutter project
        working-directory: assetflow_mobile
        run: test -f pubspec.yaml

      - name: Get Flutter dependencies
        working-directory: assetflow_mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: assetflow_mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
