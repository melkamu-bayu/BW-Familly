name: AssetFlow - Fix Child Page Back Buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: assetflow_mobile
        run: flutter pub get

      - name: Fix Vehicle model
        working-directory: assetflow_mobile
        run: |
          set -e

          FILE=lib/models/models.dart

          grep -q "class Vehicle" "$FILE"

          if ! grep -q "currentValue" "$FILE"; then
            perl -0pi -e 's/(final double mileage;)/$1\n  final double? currentValue;\n  final double? purchasePrice;/' "$FILE"
          fi

          if ! grep -q "this.currentValue" "$FILE"; then
            perl -0pi -e 's/(required this.mileage,)/$1\n    this.currentValue,\n    this.purchasePrice,/' "$FILE"
          fi

          if ! grep -q "currentValue:" "$FILE"; then
            perl -0pi -e 's/(mileage: \(json\['\''mileage'\''\] as num\)\.toDouble\(\),)/$1\n        currentValue: (json['\''current_value'\''] as num?)?.toDouble(),\n        purchasePrice: (json['\''purchase_price'\''] as num?)?.toDouble(),/' "$FILE"
          fi

          grep -q "final double? currentValue;" "$FILE"
          grep -q "final double? purchasePrice;" "$FILE"

      - name: Find child detail pages
        working-directory: assetflow_mobile
        run: |
          set -e

          test -n "$(find lib/screens/vehicles -type f -name '*.dart' -print -quit)"
          test -n "$(find lib/screens/properties -type f -name '*.dart' -print -quit)"

          echo "Vehicle screen files:"
          find lib/screens/vehicles -type f -name '*.dart'

          echo "Property screen files:"
          find lib/screens/properties -type f -name '*.dart'

      - name: Add Vehicle back buttons
        working-directory: assetflow_mobile
        run: |
          set -e

          for FILE in lib/screens/vehicles/*.dart; do
            if grep -q "appBar: AppBar(" "$FILE" && ! grep -q "leading:" "$FILE"; then
              perl -0pi -e 's/appBar: AppBar\(/appBar: AppBar(\n        leading: const BackButton(),/' "$FILE"
            fi
          done

      - name: Add Property back buttons
        working-directory: assetflow_mobile
        run: |
          set -e

          for FILE in lib/screens/properties/*.dart; do
            if grep -q "appBar: AppBar(" "$FILE" && ! grep -q "leading:" "$FILE"; then
              perl -0pi -e 's/appBar: AppBar\(/appBar: AppBar(\n        leading: const BackButton(),/' "$FILE"
            fi
          done

      - name: Format
        working-directory: assetflow_mobile
        run: dart format lib

      - name: Verify child back buttons
        working-directory: assetflow_mobile
        run: |
          set -e

          grep -R "leading: const BackButton()" lib/screens/vehicles
          grep -R "leading: const BackButton()" lib/screens/properties

          echo "Vehicle and Property child back buttons verified."

      - name: Analyze
        working-directory: assetflow_mobile
        run: flutter analyze

      - name: Build APK
        working-directory: assetflow_mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Commit
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/lib

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix child page back buttons"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
