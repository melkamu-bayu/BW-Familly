name: Build AssetFlow APK - New UI

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Check repository and ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING REPOSITORY"
          echo "======================================"

          pwd
          ls -lah

          if [ ! -f "AssetFlow_mobile_final_home_ui.zip" ]; then
            echo "ERROR: AssetFlow_mobile_final_home_ui.zip not found."
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "AssetFlow_mobile_final_home_ui.zip"

      - name: Backup current assetflow_mobile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BACKING UP CURRENT APP"
          echo "======================================"

          if [ -d "assetflow_mobile" ]; then
            echo "Backing up existing assetflow_mobile..."

            rm -rf assetflow_mobile_backup

            cp -R assetflow_mobile assetflow_mobile_backup

            echo "Backup created:"
            du -sh assetflow_mobile_backup
          else
            echo "No existing assetflow_mobile directory."
          fi

      - name: Extract new UI ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING NEW UI"
          echo "======================================"

          rm -rf extracted_ui
          mkdir -p extracted_ui

          unzip -q "AssetFlow_mobile_final_home_ui.zip" \
            -d extracted_ui

          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted structure:"
          find extracted_ui -maxdepth 4 -type f | sort | head -200

      - name: Locate Flutter project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING FLUTTER PROJECT"
          echo "======================================"

          PUBSPEC=$(find extracted_ui \
            -name pubspec.yaml \
            -type f \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: No pubspec.yaml found inside ZIP."
            echo ""
            echo "Full extracted structure:"
            find extracted_ui -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify new Flutter project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING NEW UI"
          echo "======================================"

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml missing."
            exit 1
          fi

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project contents:"
          ls -lah "$PROJECT_DIR"

      - name: Replace assetflow_mobile with new UI
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALLING NEW UI"
          echo "======================================"

          rm -rf assetflow_mobile

          mkdir -p assetflow_mobile

          cp -R "$PROJECT_DIR"/. assetflow_mobile/

          echo "New UI copied to assetflow_mobile."

          echo ""
          echo "New assetflow_mobile:"
          ls -lah assetflow_mobile

      - name: Configure production API
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURING PRODUCTION API"
          echo "======================================"

          mkdir -p lib/core

          cat > lib/core/config.dart <<'EOF'
          class AppConfig {
            AppConfig._();

            static const String apiBaseUrl = String.fromEnvironment(
              'API_BASE_URL',
              defaultValue:
                  'https://assetflow-api-f435.onrender.com/api/v1',
            );

            static const String defaultCurrency = 'ETB';

            static const Duration idleLockTimeout =
                Duration(minutes: 5);
          }
          EOF

          echo "Production API configuration:"
          cat lib/core/config.dart

      - name: Prepare Android project
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android folder missing."
            echo "Creating Android project..."
            flutter create .
          else
            echo "Android project already exists."
          fi

      - name: Configure Android Internet permission
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "Internet permission already exists."
          else
            python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = (
              '    <uses-permission '
              'android:name="android.permission.INTERNET"/>\n'
          )

          start = text.find("<manifest")

          if start == -1:
              raise SystemExit(
                  "ERROR: <manifest> tag not found."
              )

          end = text.find(">", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: Invalid AndroidManifest.xml"
              )

          if "android.permission.INTERNET" not in text:
              text = (
                  text[:end + 1]
                  + "\n"
                  + permission
                  + text[end + 1:]
              )

          manifest.write_text(text)

          print("Internet permission configured.")
          PY
          fi

          echo ""
          echo "Internet permission:"
          grep "android.permission.INTERNET" "$MANIFEST"

      - name: Flutter pub get
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          flutter pub get

      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          flutter analyze

      - name: Check Render API
        shell: bash
        run: |
          set -e

          API_URL="https://assetflow-api-f435.onrender.com/api/v1"
          DOCS_URL="https://assetflow-api-f435.onrender.com/docs"

          echo "======================================"
          echo "CHECKING PRODUCTION API"
          echo "======================================"

          echo "API:"
          echo "$API_URL"

          HTTP_CODE=$(curl \
            -L \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            "$DOCS_URL")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Render API unavailable."
            exit 1
          fi

          echo "Render API is reachable."

      - name: Build release APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          API_BASE_URL="https://assetflow-api-f435.onrender.com/api/v1"

          echo "======================================"
          echo "BUILDING ASSETFLOW APK"
          echo "======================================"

          echo "Production API:"
          echo "$API_BASE_URL"

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify APK
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: assetflow-new-ui-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
