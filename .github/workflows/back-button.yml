name: Fix Back Button - All Inner Pages

on:
  workflow_dispatch:

jobs:
  fix-back-button:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Replace NavShell with reliable global back button
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          cat > lib/widgets/nav_shell.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:go_router/go_router.dart';

          import '../core/theme.dart';
          import '../screens/transactions/add_transaction_sheet.dart';
          import '../state/auth_provider.dart';

          class NavShell extends ConsumerWidget {
            final Widget child;

            const NavShell({
              super.key,
              required this.child,
            });

            int _indexFor(String path) {
              if (path.startsWith('/assets') ||
                  path.startsWith('/vehicles') ||
                  path.startsWith('/properties') ||
                  path.startsWith('/shop') ||
                  path.startsWith('/gold-project') ||
                  path.startsWith('/accounts')) {
                return 1;
              }

              if (path.startsWith('/reports')) {
                return 3;
              }

              if (path.startsWith('/settings')) {
                return 4;
              }

              return 0;
            }

            bool _isDashboard(String path) {
              return path == '/dashboard' || path == '/';
            }

            void _goBack(BuildContext context) {
              if (context.canPop()) {
                context.pop();
              } else {
                context.go('/dashboard');
              }
            }

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final path = GoRouterState.of(context).uri.path;
              final selected = _indexFor(path);
              final canRecord =
                  ref.watch(authProvider).canRecordTransactions;

              final showBackButton = !_isDashboard(path);

              return Scaffold(
                body: Stack(
                  children: [
                    Positioned.fill(
                      child: child,
                    ),

                    if (showBackButton)
                      Positioned(
                        top: 0,
                        left: 0,
                        child: SafeArea(
                          bottom: false,
                          child: Padding(
                            padding: const EdgeInsets.only(
                              left: 12,
                              top: 8,
                            ),
                            child: Material(
                              color: Colors.white,
                              elevation: 5,
                              shape: const CircleBorder(),
                              child: InkWell(
                                customBorder: const CircleBorder(),
                                onTap: () => _goBack(context),
                                child: const SizedBox(
                                  width: 44,
                                  height: 44,
                                  child: Icon(
                                    Icons.arrow_back_rounded,
                                    size: 25,
                                    color: AppTheme.ink,
                                  ),
                                ),
                              ),
                            ),
                          ),
                        ),
                      ),
                  ],
                ),

                bottomNavigationBar: SafeArea(
                  top: false,
                  child: Container(
                    height: 78,
                    margin: const EdgeInsets.fromLTRB(12, 0, 12, 8),
                    padding: const EdgeInsets.symmetric(horizontal: 6),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(24),
                      border: Border.all(
                        color: const Color(0xFFE8ECF3),
                      ),
                      boxShadow: const [
                        BoxShadow(
                          color: Color(0x160B2A66),
                          blurRadius: 22,
                          offset: Offset(0, 8),
                        ),
                      ],
                    ),
                    child: Row(
                      children: [
                        _NavItem(
                          icon: Icons.home_outlined,
                          selectedIcon: Icons.home_rounded,
                          label: 'Home',
                          selected: selected == 0,
                          onTap: () => context.go('/dashboard'),
                        ),

                        _NavItem(
                          icon: Icons.business_center_outlined,
                          selectedIcon: Icons.business_center,
                          label: 'Assets',
                          selected: selected == 1,
                          onTap: () => context.go('/assets'),
                        ),

                        Expanded(
                          child: GestureDetector(
                            onTap: canRecord
                                ? () => _showAdd(context)
                                : null,
                            child: Column(
                              mainAxisAlignment:
                                  MainAxisAlignment.center,
                              children: [
                                Transform.translate(
                                  offset: const Offset(0, -12),
                                  child: Container(
                                    width: 48,
                                    height: 48,
                                    decoration: BoxDecoration(
                                      color: canRecord
                                          ? AppTheme.blue
                                          : const Color(0xFFD8DEE8),
                                      shape: BoxShape.circle,
                                      boxShadow: const [
                                        BoxShadow(
                                          color: Color(0x250B2A66),
                                          blurRadius: 14,
                                          offset: Offset(0, 6),
                                        ),
                                      ],
                                    ),
                                    child: const Icon(
                                      Icons.add_rounded,
                                      color: Colors.white,
                                      size: 30,
                                    ),
                                  ),
                                ),
                                Transform.translate(
                                  offset: const Offset(0, -10),
                                  child: const Text(
                                    'Add',
                                    style: TextStyle(
                                      fontSize: 11,
                                      fontWeight: FontWeight.w600,
                                      color: AppTheme.muted,
                                    ),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),

                        _NavItem(
                          icon: Icons.bar_chart_outlined,
                          selectedIcon: Icons.bar_chart_rounded,
                          label: 'Reports',
                          selected: selected == 3,
                          onTap: () => context.go('/reports'),
                        ),

                        _NavItem(
                          icon: Icons.person_outline_rounded,
                          selectedIcon: Icons.person_rounded,
                          label: 'Profile',
                          selected: selected == 4,
                          onTap: () => context.go('/settings'),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Future<void> _showAdd(BuildContext context) async {
              final kind =
                  await showModalBottomSheet<TransactionKind>(
                context: context,
                showDragHandle: true,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(
                    top: Radius.circular(24),
                  ),
                ),
                builder: (sheetContext) {
                  return SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.fromLTRB(
                        20,
                        8,
                        20,
                        24,
                      ),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Text(
                            'Add to AssetFlow',
                            style: TextStyle(
                              fontSize: 20,
                              fontWeight: FontWeight.w800,
                              color: AppTheme.ink,
                            ),
                          ),

                          const SizedBox(height: 10),

                          ListTile(
                            leading: const CircleAvatar(
                              backgroundColor: Color(0x1535C759),
                              child: Icon(
                                Icons.arrow_downward,
                                color: AppTheme.green,
                              ),
                            ),
                            title: const Text('Add Income'),
                            onTap: () {
                              Navigator.pop(
                                sheetContext,
                                TransactionKind.revenue,
                              );
                            },
                          ),

                          ListTile(
                            leading: const CircleAvatar(
                              backgroundColor: Color(0x15E94B5F),
                              child: Icon(
                                Icons.arrow_upward,
                                color: AppTheme.red,
                              ),
                            ),
                            title: const Text('Add Expense'),
                            onTap: () {
                              Navigator.pop(
                                sheetContext,
                                TransactionKind.expense,
                              );
                            },
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );

              if (kind == null || !context.mounted) {
                return;
              }

              await showModalBottomSheet<void>(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(
                    top: Radius.circular(24),
                  ),
                ),
                builder: (_) {
                  return AddTransactionSheet(
                    kind: kind,
                  );
                },
              );
            }
          }

          class _NavItem extends StatelessWidget {
            final IconData icon;
            final IconData selectedIcon;
            final String label;
            final bool selected;
            final VoidCallback onTap;

            const _NavItem({
              required this.icon,
              required this.selectedIcon,
              required this.label,
              required this.selected,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return Expanded(
                child: InkWell(
                  onTap: onTap,
                  borderRadius: BorderRadius.circular(18),
                  child: Column(
                    mainAxisAlignment:
                        MainAxisAlignment.center,
                    children: [
                      Icon(
                        selected ? selectedIcon : icon,
                        color: selected
                            ? AppTheme.blue
                            : AppTheme.muted,
                        size: 24,
                      ),
                      const SizedBox(height: 4),
                      Text(
                        label,
                        style: TextStyle(
                          fontSize: 10.5,
                          fontWeight: selected
                              ? FontWeight.w800
                              : FontWeight.w500,
                          color: selected
                              ? AppTheme.blue
                              : AppTheme.muted,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Verify back-button implementation
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking NavShell..."

          grep -q "context.canPop()" lib/widgets/nav_shell.dart
          grep -q "context.pop()" lib/widgets/nav_shell.dart
          grep -q "context.go('/dashboard')" lib/widgets/nav_shell.dart
          grep -q "arrow_back_rounded" lib/widgets/nav_shell.dart

          echo "Back-button implementation verified."

      - name: Flutter format
        working-directory: assetflow_mobile
        run: |
          dart format lib/widgets/nav_shell.dart

      - name: Flutter analyze
        working-directory: assetflow_mobile
        shell: bash
        run: |
          set +e

          flutter pub get

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "Flutter analysis failed."
            exit "$STATUS"
          fi

          echo "Flutter analysis passed."

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/lib/widgets/nav_shell.dart

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix back button on all inner pages"
          git push
