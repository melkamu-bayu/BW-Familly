name: Fix Back Button - All Inner Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-back-buttons:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # ============================================================
      # 2. Install Flutter
      # ============================================================
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ============================================================
      # 3. Verify Flutter project
      # ============================================================
      - name: Verify Flutter project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/router.dart

          echo "Flutter project found."
          flutter --version

      # ============================================================
      # 4. Apply Back button to every routed inner page
      # ============================================================
      - name: Apply complete inner-page Back-button fix
        working-directory: assetflow_mobile
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path("lib")
          SCREENS = ROOT / "screens"

          GO_ROUTER_IMPORT = (
              "import 'package:go_router/go_router.dart';"
          )

          ROOT_ROUTE = "/dashboard"

          # ----------------------------------------------------------
          # Helpers
          # ----------------------------------------------------------

          def read(path):
              return path.read_text(encoding="utf-8")

          def write(path, text):
              path.write_text(text, encoding="utf-8")

          def add_import(path):
              text = read(path)

              if GO_ROUTER_IMPORT in text:
                  return

              lines = text.splitlines()

              last_package_import = -1

              for i, line in enumerate(lines):
                  if line.startswith("import 'package:"):
                      last_package_import = i

              if last_package_import >= 0:
                  lines.insert(
                      last_package_import + 1,
                      GO_ROUTER_IMPORT
                  )
              else:
                  lines.insert(0, GO_ROUTER_IMPORT)

              write(
                  path,
                  "\n".join(lines) + "\n"
              )

          def has_back_button(text):
              return (
                  "tooltip: 'Back'" in text
                  and "context.canPop()" in text
                  and "context.pop()" in text
              )

          def find_appbar(text):
              """
              Find the first AppBar(...) expression without depending
              on indentation or exact formatting.
              """

              match = re.search(
                  r"\bappBar\s*:\s*AppBar\s*\(",
                  text
              )

              if not match:
                  return None

              open_pos = text.find(
                  "(",
                  match.start()
              )

              depth = 0
              in_string = False
              string_char = None
              escape = False

              for i in range(
                  open_pos,
                  len(text)
              ):
                  c = text[i]

                  if in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == string_char:
                          in_string = False
                      continue

                  if c in ("'", '"'):
                      in_string = True
                      string_char = c
                      continue

                  if c == "(":
                      depth += 1

                  elif c == ")":
                      depth -= 1

                      if depth == 0:
                          end = i + 1

                          if (
                              end < len(text)
                              and text[end] == ","
                          ):
                              end += 1

                          return (
                              match.start(),
                              end
                          )

              return None

          def add_back_button(path, fallback):
              text = read(path)

              if has_back_button(text):
                  return False

              appbar = find_appbar(text)

              if not appbar:
                  raise RuntimeError(
                      f"Could not find AppBar in {path}. "
                      "The workflow stopped to prevent an incomplete fix."
                  )

              start, end = appbar

              block = text[start:end]

              # Do not overwrite custom leading widgets.
              if re.search(
                  r"\bleading\s*:",
                  block
              ):
                  raise RuntimeError(
                      f"{path} already has a custom leading widget. "
                      "Manual review is required."
                  )

              # Determine indentation from appBar line.
              line_start = text.rfind(
                  "\n",
                  0,
                  start
              ) + 1

              appbar_indent = text[
                  line_start:start
              ]

              leading_indent = (
                  appbar_indent + "  "
              )

              body_indent = (
                  leading_indent + "  "
              )

              # Keep the existing AppBar contents.
              open_paren = block.find("(")
              close_paren = block.rfind(")")

              inner = block[
                  open_paren + 1:
                  close_paren
              ].strip()

              # Remove a possible existing leading entry.
              inner = re.sub(
                  r"^\s*leading\s*:\s*.*?,",
                  "",
                  inner,
                  count=1,
                  flags=re.S
              ).strip()

              new_block = (
                  f"{appbar_indent}appBar: AppBar(\n"
                  f"{leading_indent}leading: IconButton(\n"
                  f"{body_indent}icon: const "
                  f"Icon(Icons.arrow_back_rounded),\n"
                  f"{body_indent}tooltip: 'Back',\n"
                  f"{body_indent}onPressed: () {{\n"
                  f"{body_indent}  if (context.canPop()) {{\n"
                  f"{body_indent}    context.pop();\n"
                  f"{body_indent}  }} else {{\n"
                  f"{body_indent}    context.go('{fallback}');\n"
                  f"{body_indent}  }}\n"
                  f"{body_indent}}},\n"
                  f"{leading_indent}),\n"
              )

              if inner:
                  new_block += (
                      f"{appbar_indent}  {inner}\n"
                  )

              new_block += (
                  f"{appbar_indent}),"
              )

              write(
                  path,
                  text[:start]
                  + new_block
                  + text[end:]
              )

              return True

          # ----------------------------------------------------------
          # Determine route declarations from router.dart
          # ----------------------------------------------------------

          router_path = ROOT / "router.dart"
          router_text = read(router_path)

          if (
              "initialLocation: '/dashboard'"
              not in router_text
          ):
              raise RuntimeError(
                  "ERROR: /dashboard is not configured as "
                  "the initial route."
              )

          route_paths = sorted(
              set(
                  re.findall(
                      r"\bpath\s*:\s*['\"]([^'\"]+)['\"]",
                      router_text
                  )
              )
          )

          if not route_paths:
              raise RuntimeError(
                  "ERROR: No routes were discovered in router.dart."
              )

          print("")
          print("Routes discovered in router.dart:")
          print("--------------------------------")

          for route in route_paths:
              print(route)

          print("")

          # ----------------------------------------------------------
          # Build route -> screen file mapping
          #
          # We inspect GoRoute builders and pageBuilder definitions
          # surrounding each path.
          # ----------------------------------------------------------

          routed_screens = {}

          for route in route_paths:

              if route == ROOT_ROUTE:
                  continue

              # Find the route declaration.
              route_match = re.search(
                  rf"path\s*:\s*['\"]"
                  rf"{re.escape(route)}"
                  rf"['\"]",
                  router_text
              )

              if not route_match:
                  continue

              # Inspect a reasonable block after the path.
              section = router_text[
                  route_match.start():
                  route_match.start() + 2500
              ]

              # Try common screen constructor patterns.
              candidates = re.findall(
                  r"(?:builder|pageBuilder).*?"
                  r"(?:child|page)\s*:\s*"
                  r"([A-Z][A-Za-z0-9_]*)",
                  section,
                  flags=re.S
              )

              # Also find const/class constructors directly.
              if not candidates:
                  candidates = re.findall(
                      r"\b([A-Z][A-Za-z0-9_]*Screen)\s*\(",
                      section
                  )

              if candidates:
                  routed_screens[route] = candidates[0]

          print("Routed inner pages discovered:")
          print("--------------------------------")

          for route, screen in routed_screens.items():
              print(
                  f"{route} -> {screen}"
              )

          print("")

          # ----------------------------------------------------------
          # Known AssetFlow route fallbacks.
          #
          # These are used only when a page is opened directly and
          # there is no previous navigation stack.
          # ----------------------------------------------------------

          fallback_map = {
              "/vehicles": "/assets",
              "/vehicle": "/vehicles",
              "/vehicle/:id": "/vehicles",

              "/properties": "/assets",
              "/property": "/properties",
              "/property/:id": "/properties",

              "/shop": "/assets",

              "/gold-project": "/assets",

              "/accounts": "/assets",

              "/reports": "/dashboard",

              "/notifications": "/dashboard",
          }

          # ----------------------------------------------------------
          # Find actual screen Dart files.
          # ----------------------------------------------------------

          all_screen_files = sorted(
              SCREENS.rglob("*_screen.dart")
          )

          if not all_screen_files:
              raise RuntimeError(
                  "ERROR: No *_screen.dart files were found."
              )

          print("Screen files discovered:")
          print("-----------------------")

          for path in all_screen_files:
              print(path)

          print("")

          # ----------------------------------------------------------
          # Process every routed inner page.
          #
          # We identify pages from router.dart first. If a route
          # cannot be mapped automatically, stop instead of silently
          # skipping it.
          # ----------------------------------------------------------

          changed = []
          already_fixed = []

          for route in route_paths:

              if route == ROOT_ROUTE:
                  continue

              screen_class = routed_screens.get(route)

              if not screen_class:
                  print(
                      f"WARNING: Could not identify screen class "
                      f"for route {route}."
                  )
                  continue

              matching_files = []

              for path in all_screen_files:
                  text = read(path)

                  if re.search(
                      rf"\bclass\s+{re.escape(screen_class)}\b",
                      text
                  ):
                      matching_files.append(path)

              if not matching_files:
                  raise RuntimeError(
                      f"Could not locate Dart file for route "
                      f"{route} -> {screen_class}"
                  )

              if len(matching_files) > 1:
                  raise RuntimeError(
                      f"Multiple files found for "
                      f"{route} -> {screen_class}: "
                      f"{matching_files}"
                  )

              path = matching_files[0]

              # Dashboard must never be modified.
              if path.name == "dashboard_screen.dart":
                  raise RuntimeError(
                      f"ERROR: Route {route} resolves to Dashboard. "
                      "Dashboard must remain the root page."
                  )

              add_import(path)

              fallback = fallback_map.get(
                  route,
                  ROOT_ROUTE
              )

              if add_back_button(
                  path,
                  fallback
              ):
                  changed.append(str(path))
              else:
                  already_fixed.append(str(path))

          # ----------------------------------------------------------
          # Report
          # ----------------------------------------------------------

          print("")
          print("========================================")
          print("Back-button processing completed")
          print("========================================")

          print("")
          print("Changed:")
          for item in changed:
              print(f"  + {item}")

          print("")
          print("Already correct:")
          for item in already_fixed:
              print(f"  = {item}")

          print("")
          print(
              f"Routed inner pages processed: "
              f"{len(changed) + len(already_fixed)}"
          )

      # ============================================================
      # 5. Verify Dashboard remains root
      # ============================================================
      - name: Verify Dashboard protection
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          grep -q \
            "initialLocation: '/dashboard'" \
            lib/router.dart

          if grep -q \
            "tooltip: 'Back'" \
            lib/screens/dashboard/dashboard_screen.dart; then

            echo "ERROR: Dashboard has a Back button."
            exit 1
          fi

          echo "Dashboard protection verified."

      # ============================================================
      # 6. Verify NavShell does not intercept Back
      # ============================================================
      - name: Verify NavShell protection
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          if grep -q "PopScope" \
            lib/widgets/nav_shell.dart; then

            echo "ERROR: PopScope detected in NavShell."
            echo "Back must be handled by individual inner pages."
            exit 1
          fi

          echo "NavShell protection verified."

      # ============================================================
      # 7. Verify EVERY routed inner page
      # ============================================================
      - name: Verify every inner page has Back
        working-directory: assetflow_mobile
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path("lib")
          router = ROOT / "router.dart"

          text = router.read_text(
              encoding="utf-8"
          )

          routes = sorted(
              set(
                  re.findall(
                      r"\bpath\s*:\s*['\"]([^'\"]+)['\"]",
                      text
                  )
              )
          )

          failures = []

          for route in routes:

              if route == "/dashboard":
                  continue

              match = re.search(
                  rf"path\s*:\s*['\"]"
                  rf"{re.escape(route)}"
                  rf"['\"]",
                  text
              )

              if not match:
                  failures.append(
                      f"{route}: route declaration not found"
                  )
                  continue

              section = text[
                  match.start():
                  match.start() + 2500
              ]

              classes = re.findall(
                  r"\b([A-Z][A-Za-z0-9_]*Screen)\s*\(",
                  section
              )

              if not classes:
                  failures.append(
                      f"{route}: could not identify screen"
                  )
                  continue

              screen_class = classes[0]

              found = []

              for path in (
                  ROOT / "screens"
              ).rglob("*.dart"):

                  dart = path.read_text(
                      encoding="utf-8"
                  )

                  if re.search(
                      rf"\bclass\s+"
                      rf"{re.escape(screen_class)}\b",
                      dart
                  ):
                      found.append(path)

              if len(found) != 1:
                  failures.append(
                      f"{route}: screen mapping invalid "
                      f"({screen_class})"
                  )
                  continue

              screen = found[0]

              dart = screen.read_text(
                  encoding="utf-8"
              )

              if "tooltip: 'Back'" not in dart:
                  failures.append(
                      f"{route}: Back button missing"
                  )

              if "context.canPop()" not in dart:
                  failures.append(
                      f"{route}: context.canPop() missing"
                  )

              if "context.pop()" not in dart:
                  failures.append(
                      f"{route}: context.pop() missing"
                  )

          if failures:
              print("")
              print(
                  "ERROR: Inner-page verification failed:"
              )

              for failure in failures:
                  print(f"  - {failure}")

              raise SystemExit(1)

          print("")
          print(
              "SUCCESS: Every routed inner page has "
              "a Back button."
          )

      # ============================================================
      # 8. Verify navigation stack
      # ============================================================
      - name: Verify push navigation
        working-directory: assetflow_mobile
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path("lib")

          router = (
              ROOT / "router.dart"
          ).read_text(
              encoding="utf-8"
          )

          routes = sorted(
              set(
                  re.findall(
                      r"\bpath\s*:\s*['\"]([^'\"]+)['\"]",
                      router
                  )
              )
          )

          problematic = []

          for path in ROOT.rglob("*.dart"):

              if path.name in {
                  "router.dart",
                  "nav_shell.dart",
              }:
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              for route in routes:

                  if route == "/dashboard":
                      continue

                  if (
                      f"context.go('{route}')"
                      in text
                      or
                      f'context.go("{route}")'
                      in text
                  ):
                      problematic.append(
                          f"{path}: context.go({route})"
                      )

          if problematic:
              print(
                  "ERROR: Inner-page navigation still uses "
                  "context.go():"
              )

              for item in problematic:
                  print(f"  - {item}")

              raise SystemExit(1)

          print(
              "SUCCESS: Inner-page navigation uses "
              "push/pop stack behavior."
          )

      # ============================================================
      # 9. Format
      # ============================================================
      - name: Format Dart files
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          dart format lib

      # ============================================================
      # 10. Get dependencies
      # ============================================================
      - name: Get dependencies
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter pub get

      # ============================================================
      # 11. Analyze
      # ============================================================
      - name: Run Flutter analyze
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter analyze

      # ============================================================
      # 12. Show final changes
      # ============================================================
      - name: Show changed files
        run: |
          set -euo pipefail

          echo "================================"
          echo "Git status"
          echo "================================"

          git status --short

          echo ""
          echo "================================"
          echo "Git diff stat"
          echo "================================"

          git diff --stat

      # ============================================================
      # 13. Commit and push
      # ============================================================
      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes were necessary."
            exit 0
          fi

          git add assetflow_mobile/lib

          git commit \
            -m "Fix back navigation for all inner pages"

          git push origin master
