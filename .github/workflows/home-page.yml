name: AssetFlow - Fix Home Page Slowness

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-home:
    name: Fix and Verify Home Dashboard
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "assetflow_mobile/pubspec.yaml"
            "assetflow_mobile/lib/state/data_providers.dart"
            "assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart"
            "assetflow_mobile/lib/models/home_models.dart"
            "assetflow_mobile/lib/models/models.dart"
            "assetflow_mobile/lib/core/api_client.dart"
            "assetflow-backend/app/api/v1/dashboard.py"
            "assetflow-backend/app/services/financial_calculator.py"
          )

          for file in "${files[@]}"; do
            test -f "$file"
          done

          echo "Repository structure verified."

      - name: Create backup
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .home-performance-backup

          cp assetflow_mobile/lib/state/data_providers.dart \
             .home-performance-backup/data_providers.dart

          cp assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart \
             .home-performance-backup/dashboard_screen.dart

          cp assetflow-backend/app/api/v1/dashboard.py \
             .home-performance-backup/dashboard.py

      - name: Fix home dashboard provider
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path(
              "assetflow_mobile/lib/state/data_providers.dart"
          )

          text = path.read_text()

          pattern = re.compile(
              r"/// Composite provider used by the redesigned home dashboard\."
              r".*?"
              r"(?=final homeTrendProvider =)",
              re.DOTALL,
          )

          if not pattern.search(text):
              raise SystemExit(
                  "ERROR: Existing homeDashboardProvider block "
                  "was not found. No changes made."
              )

          replacement = """/// Composite provider used by the redesigned home dashboard.
///
/// Only the financial summary blocks the initial home render.
/// Secondary dashboard data is loaded independently by the
/// individual providers below/above this provider.
final homeDashboardProvider =
    FutureProvider.autoDispose<HomeDashboardData>((ref) async {
  final response = await ApiClient.instance.requestWithRetry(
    () => ApiClient.instance.dio.get('/dashboard/summary'),
  );

  final summary = DashboardSummary.fromJson(
    response.data as Map<String, dynamic>,
  );

  return HomeDashboardData(
    summary: summary,
    performance: const [],
    vehicles: const [],
    properties: const [],
    products: const [],
    project: null,
    shop: null,
    transactions: const [],
    unreadNotifications: 0,
  );
});

/// Recent transactions are loaded independently so they cannot
/// delay the initial home dashboard render.
final homeRecentTransactionsProvider =
    FutureProvider.autoDispose<List<RecentTransaction>>((ref) async {
  final api = ApiClient.instance;
  final now = DateTime.now();

  final from = now
      .subtract(const Duration(days: 60))
      .toIso8601String()
      .split('T')
      .first;

  final to = now
      .toIso8601String()
      .split('T')
      .first;

  final responses = await Future.wait<Response<dynamic>>([
    api.requestWithRetry(
      () => api.dio.get(
        '/revenue',
        queryParameters: {
          'date_from': from,
          'date_to': to,
          'page': 1,
          'per_page': 10,
        },
      ),
    ),
    api.requestWithRetry(
      () => api.dio.get(
        '/expenses',
        queryParameters: {
          'date_from': from,
          'date_to': to,
          'page': 1,
          'per_page': 10,
        },
      ),
    ),
  ]);

  final items = <RecentTransaction>[];

  final revenueRows =
      (responses[0].data as List).cast<Map<String, dynamic>>();

  final expenseRows =
      (responses[1].data as List).cast<Map<String, dynamic>>();

  for (final row in revenueRows) {
    items.add(
      RecentTransaction(
        isIncome: true,
        title:
            (row['description'] as String?)?.trim().isNotEmpty == true
                ? row['description'] as String
                : 'Revenue',
        subtitle:
            row['category'] as String? ?? 'Income',
        amount:
            double.tryParse(row['amount'].toString()) ?? 0,
        date: DateTime.tryParse(
              row['created_at']?.toString() ??
                  row['txn_date']?.toString() ??
                  '',
            ) ??
            now,
      ),
    );
  }

  for (final row in expenseRows) {
    items.add(
      RecentTransaction(
        isIncome: false,
        title:
            (row['description'] as String?)?.trim().isNotEmpty == true
                ? row['description'] as String
                : 'Expense',
        subtitle:
            row['category'] as String? ?? 'Expense',
        amount:
            double.tryParse(row['amount'].toString()) ?? 0,
        date: DateTime.tryParse(
              row['created_at']?.toString() ??
                  row['txn_date']?.toString() ??
                  '',
            ) ??
            now,
      ),
    );
  }

  items.sort((a, b) => b.date.compareTo(a.date));

  return items.take(5).toList();
});

"""

          text = pattern.sub(replacement, text, count=1)

          path.write_text(text)

          print("Home provider converted to summary-first loading.")

      - name: Fix dashboard screen loading
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path(
              "assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart"
          )

          text = path.read_text()

          pattern = re.compile(
              r"class DashboardScreen extends ConsumerWidget \{"
              r".*?"
              r"(?=class _HomeContent extends StatelessWidget)",
              re.DOTALL,
          )

          if not pattern.search(text):
              raise SystemExit(
                  "ERROR: DashboardScreen class was not found. "
                  "No changes made."
              )

          replacement = """class DashboardScreen extends ConsumerWidget {
  const DashboardScreen({super.key});

  @override
  Widget build(BuildContext context, WidgetRef ref) {
    final homeAsync = ref.watch(homeDashboardProvider);
    final trendAsync = ref.watch(homeTrendProvider);

    final vehiclesAsync = ref.watch(vehiclesProvider);
    final propertiesAsync = ref.watch(propertiesProvider);
    final productsAsync = ref.watch(shopProductsProvider);
    final projectAsync = ref.watch(goldProjectDashboardProvider);
    final shopAsync = ref.watch(shopDashboardProvider);
    final transactionsAsync =
        ref.watch(homeRecentTransactionsProvider);
    final notificationsAsync =
        ref.watch(notificationsProvider);

    final user = ref.watch(authProvider).user;

    return Scaffold(
      body: SafeArea(
        child: RefreshIndicator(
          onRefresh: () async {
            ref.invalidate(homeDashboardProvider);
            ref.invalidate(homeTrendProvider);
            ref.invalidate(vehiclesProvider);
            ref.invalidate(propertiesProvider);
            ref.invalidate(shopProductsProvider);
            ref.invalidate(goldProjectDashboardProvider);
            ref.invalidate(shopDashboardProvider);
            ref.invalidate(homeRecentTransactionsProvider);
            ref.invalidate(notificationsProvider);

            await ref.read(homeDashboardProvider.future);
          },
          child: homeAsync.when(
            loading: () => const _DashboardSkeleton(),
            error: (error, _) => _DashboardError(
              onRetry: () {
                ref.invalidate(homeDashboardProvider);
              },
            ),
            data: (baseData) {
              final data = HomeDashboardData(
                summary: baseData.summary,
                performance: const [],
                vehicles:
                    vehiclesAsync.valueOrNull ?? const [],
                properties:
                    propertiesAsync.valueOrNull ?? const [],
                products:
                    productsAsync.valueOrNull ?? const [],
                project:
                    projectAsync.valueOrNull,
                shop:
                    shopAsync.valueOrNull,
                transactions:
                    transactionsAsync.valueOrNull ?? const [],
                unreadNotifications:
                    notificationsAsync.valueOrNull
                            ?.where(
                              (notification) =>
                                  !notification.isRead,
                            )
                            .length ??
                        0,
              );

              return _HomeContent(
                data: data,
                trend: trendAsync.valueOrNull,
                userName:
                    user?.fullName.split(' ').first ?? 'there',
              );
            },
          ),
        ),
      ),
    );
  }
}

"""

          text = pattern.sub(replacement, text, count=1)

          path.write_text(text)

          print("DashboardScreen converted to progressive loading.")

      - name: Optimize financial summary
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "assetflow-backend/app/api/v1/dashboard.py"
          )

          text = path.read_text()

          old = """    return {
        "today": {
            "revenue": total_revenue(db, date_from=today, date_to=today),
            "expense": total_expense(db, date_from=today, date_to=today),
            "net_profit": net_profit(db, date_from=today, date_to=today),
        },
        "this_month": {
            "revenue": total_revenue(db, date_from=month_start, date_to=today),
            "expense": total_expense(db, date_from=month_start, date_to=today),
            "net_profit": net_profit(db, date_from=month_start, date_to=today),
        },
        "all_time": {
            "revenue": total_revenue(db),
            "expense": total_expense(db),
            "net_profit": net_profit(db),
        },
        "cash_and_bank_balance": cash_bank_total,
        "currency": "ETB",
    }"""

          new = """    today_revenue = total_revenue(
        db,
        date_from=today,
        date_to=today,
    )
    today_expense = total_expense(
        db,
        date_from=today,
        date_to=today,
    )

    month_revenue = total_revenue(
        db,
        date_from=month_start,
        date_to=today,
    )
    month_expense = total_expense(
        db,
        date_from=month_start,
        date_to=today,
    )

    all_time_revenue = total_revenue(db)
    all_time_expense = total_expense(db)

    return {
        "today": {
            "revenue": today_revenue,
            "expense": today_expense,
            "net_profit": today_revenue - today_expense,
        },
        "this_month": {
            "revenue": month_revenue,
            "expense": month_expense,
            "net_profit": month_revenue - month_expense,
        },
        "all_time": {
            "revenue": all_time_revenue,
            "expense": all_time_expense,
            "net_profit": all_time_revenue - all_time_expense,
        },
        "cash_and_bank_balance": cash_bank_total,
        "currency": "ETB",
    }"""

          if old not in text:
              raise SystemExit(
                  "ERROR: Expected dashboard summary block "
                  "was not found. No backend modification made."
              )

          path.write_text(text.replace(old, new, 1))

          print("Dashboard summary queries optimized.")

      - name: Verify Dart source structure
        shell: bash
        run: |
          set -euo pipefail

          grep -q "homeRecentTransactionsProvider" \
            assetflow_mobile/lib/state/data_providers.dart

          grep -q "ref.watch(vehiclesProvider)" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          grep -q "ref.watch(propertiesProvider)" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          grep -q "ref.watch(shopProductsProvider)" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          grep -q "ref.watch(goldProjectDashboardProvider)" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          grep -q "ref.watch(shopDashboardProvider)" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          grep -q "ref.watch(homeRecentTransactionsProvider)" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          grep -q "ref.watch(notificationsProvider)" \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          echo "Progressive loading structure verified."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: |
          flutter --version
          dart --version

      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: flutter pub get

      - name: Format Dart code
        working-directory: assetflow_mobile
        run: dart format lib

      - name: Flutter analyze
        working-directory: assetflow_mobile
        run: flutter analyze

      - name: Flutter tests
        working-directory: assetflow_mobile
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate backend Python
        run: |
          python -m py_compile \
            assetflow-backend/app/api/v1/dashboard.py \
            assetflow-backend/app/services/financial_calculator.py

      - name: Build production APK
        working-directory: assetflow_mobile
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Show final diff
        run: |
          git diff --stat
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assetflow_mobile/lib/state/data_providers.dart \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart \
            assetflow-backend/app/api/v1/dashboard.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix slow home dashboard loading"
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-home-performance-fixed
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
