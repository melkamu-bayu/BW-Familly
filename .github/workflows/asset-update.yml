name: AssetFlow - Asset Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    name: Update AssetFlow Assets
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. VERIFY SOURCE FILES
      # ==========================================================
      - name: Verify AssetFlow source files
        shell: bash
        run: |
          set -euo pipefail

          test -f assetflow-backend/app/seed.py
          test -f assetflow_mobile/pubspec.yaml
          test -f assetflow_mobile/lib/screens/assets/assets_hub_screen.dart
          test -f assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          echo "AssetFlow source files verified."

      # ==========================================================
      # 3. UPDATE BACKEND ASSET DATA
      # ==========================================================
      - name: Update backend asset data
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("assetflow-backend/app/seed.py")
          text = path.read_text()

          replacements = {
              # Vehicle names
              '"EX-454"': '"EX-3952"',
              '"EX-3952A28405/0100"': '"EX-4541"',
              '"Apache-Motor"': '"A28405/01001"',
              '"Land-Cruiser-Car"': '"Land-Cruiser"',

              # Business categories
              '("RENTAL_HOUSES", "Rental Houses")':
                  '("RENTAL_HOUSES", "Houses")',

              '("SHOP", "Construction Materials Shop")':
                  '("SHOP", "Shops")',

              '("PROJECT", "Gold-Mining Project")':
                  '("PROJECT", "Projects")',

              # Business units
              'name="Construction Materials Shop"':
                  'name="Shops"',

              'name="Gold-Mining Project"':
                  'name="Projects"',
          }

          changed = False

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  print(f"UPDATED: {old} -> {new}")
                  changed = True
              else:
                  print(f"SKIPPED: {old} not found")

          if changed:
              path.write_text(text)
              print("Backend asset data updated.")
          else:
              print("Backend asset data already updated.")
          PY

      # ==========================================================
      # 4. UPDATE ASSETS HUB
      # ==========================================================
      - name: Update Assets Hub labels
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "assetflow_mobile/lib/screens/assets/assets_hub_screen.dart"
          )

          text = path.read_text()

          replacements = {
              "title: 'Rent Properties'":
                  "title: 'Houses'",

              "title: 'Construction Materials Shop'":
                  "title: 'Shops'",

              "title: 'Gold-Mining Project'":
                  "title: 'Projects'",
          }

          changed = False

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  print(f"UPDATED: {old} -> {new}")
                  changed = True
              else:
                  print(f"SKIPPED: {old} not found")

          if changed:
              path.write_text(text)
              print("Assets Hub updated.")
          else:
              print("Assets Hub already updated.")
          PY

      # ==========================================================
      # 5. UPDATE DASHBOARD LABELS
      # ==========================================================
      - name: Update Dashboard labels
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart"
          )

          text = path.read_text()

          replacements = {
              "_AssetTileData('Rent Properties',":
                  "_AssetTileData('Houses',",

              "_AssetTileData('Shop',":
                  "_AssetTileData('Shops',",
          }

          changed = False

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  print(f"UPDATED: {old} -> {new}")
                  changed = True
              else:
                  print(f"SKIPPED: {old} not found")

          if changed:
              path.write_text(text)
              print("Dashboard labels updated.")
          else:
              print("Dashboard labels already updated.")
          PY

      # ==========================================================
      # 6. FIX MACHINE CLASSIFICATION
      # ==========================================================
      - name: Fix machine classification
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart"
          )

          text = path.read_text()

          old = (
              "return name.startsWith('EX-') || "
              "name.startsWith('A') || "
              "type.contains('EXCAV') || "
              "type.contains('MACHINE');"
          )

          new = (
              "return name.startsWith('EX-') || "
              "type.contains('EXCAV') || "
              "type.contains('MACHINE');"
          )

          if old in text:
              text = text.replace(old, new)
              path.write_text(text)
              print("Machine classification fixed.")
          elif new in text:
              print("Machine classification already fixed.")
          else:
              raise SystemExit(
                  "ERROR: Machine classification code not found."
              )
          PY

      # ==========================================================
      # 7. VERIFY BACKEND
      # ==========================================================
      - name: Verify backend changes
        shell: bash
        run: |
          set -euo pipefail

          FILE="assetflow-backend/app/seed.py"

          echo "===== VEHICLES ====="

          grep -F '"EX-3952"' "$FILE"
          grep -F '"EX-4541"' "$FILE"
          grep -F '"A28405/01001"' "$FILE"
          grep -F '"A26401/15598"' "$FILE"
          grep -F '"A19876/35760"' "$FILE"
          grep -F '"Land-Cruiser"' "$FILE"

          echo "===== CATEGORIES ====="

          grep -F '("RENTAL_HOUSES", "Houses")' "$FILE"
          grep -F '("SHOP", "Shops")' "$FILE"
          grep -F '("PROJECT", "Projects")' "$FILE"

          echo "Backend verification PASSED."

      # ==========================================================
      # 8. VERIFY ASSETS HUB
      # ==========================================================
      - name: Verify Assets Hub changes
        shell: bash
        run: |
          set -euo pipefail

          FILE="assetflow_mobile/lib/screens/assets/assets_hub_screen.dart"

          grep -F "title: 'Houses'" "$FILE"
          grep -F "title: 'Shops'" "$FILE"
          grep -F "title: 'Projects'" "$FILE"

          echo "Assets Hub verification PASSED."

      # ==========================================================
      # 9. VERIFY DASHBOARD
      # ==========================================================
      - name: Verify Dashboard changes
        shell: bash
        run: |
          set -euo pipefail

          FILE="assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart"

          grep -F "_AssetTileData('Houses'" "$FILE"
          grep -F "_AssetTileData('Shops'" "$FILE"

          grep -F \
            "return name.startsWith('EX-') || type.contains('EXCAV') || type.contains('MACHINE');" \
            "$FILE"

          echo "Dashboard verification PASSED."

      # ==========================================================
      # 10. SHOW FINAL DIFF
      # ==========================================================
      - name: Show changes
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL ASSET UPDATE"
          echo "=========================================="

          git status --short

          echo ""
          echo "===== DIFF ====="

          git diff -- \
            assetflow-backend/app/seed.py \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

      # ==========================================================
      # 11. COMMIT AND PUSH
      # ==========================================================
      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assetflow-backend/app/seed.py \
            assetflow_mobile/lib/screens/assets/assets_hub_screen.dart \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "Update AssetFlow asset names and classification"

          git push

          echo "=========================================="
          echo "ASSET UPDATE SUCCESSFUL"
          echo "=========================================="
