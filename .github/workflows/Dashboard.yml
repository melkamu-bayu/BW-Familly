name: AssetFlow - Fix Dashboard Issue #3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Dart project
        run: |
          set -e

          test -f assetflow_mobile/pubspec.yaml
          test -f assetflow_mobile/analysis_options.yaml
          test -f assetflow_mobile/lib/core/api_client.dart
          test -f assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart

          echo "Dart project verified."

      # -------------------------------------------------------
      # Protect existing #1/#2 work
      # -------------------------------------------------------

      - name: Protect existing application code
        run: |
          set -e

          sha256sum \
            assetflow_mobile/lib/core/api_client.dart \
            > /tmp/api_client.sha256

          cp assetflow_mobile/analysis_options.yaml \
            /tmp/analysis_options.yaml

          if [ -f assetflow_mobile/pubspec.lock ]; then
            cp assetflow_mobile/pubspec.lock /tmp/pubspec.lock
            echo "pubspec.lock protected."
          else
            touch /tmp/no_pubspec_lock
            echo "No pubspec.lock in repository."
          fi

      # -------------------------------------------------------
      # Backup
      # -------------------------------------------------------

      - name: Create backup tag
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="before-dashboard-issue-3-${GITHUB_RUN_ID}"

          git tag "$TAG"
          git push origin "$TAG"

          echo "Backup tag created: $TAG"

      # -------------------------------------------------------
      # Dashboard #3
      # -------------------------------------------------------

      - name: Patch Dashboard
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart"
          )

          text = path.read_text()

          replacements = [
              (
                  """error: (err, _) => _ErrorTile(message: 'Could not load dashboard summary'),""",
                  """error: (err, _) => _ErrorTile(
                message: 'Could not load dashboard summary',
                onRetry: () {
                  ref.invalidate(dashboardSummaryProvider);
                },
              ),"""
              ),
              (
                  """error: (err, _) => _ErrorTile(message: 'Could not load business performance'),""",
                  """error: (err, _) => _ErrorTile(
                message: 'Could not load business performance',
                onRetry: () {
                  ref.invalidate(businessPerformanceProvider);
                },
              ),"""
              ),
              (
                  """class _ErrorTile extends StatelessWidget {
            final String message;
            const _ErrorTile({required this.message});""",
                  """class _ErrorTile extends StatelessWidget {
            final String message;
            final VoidCallback onRetry;

            const _ErrorTile({
              required this.message,
              required this.onRetry,
            });"""
              ),
              (
                  """Text(message, style: const TextStyle(color: Colors.black54)),""",
                  """Text(
              message,
              textAlign: TextAlign.center,
              style: const TextStyle(color: Colors.black54),
            ),
            const SizedBox(height: 12),
            OutlinedButton.icon(
              onPressed: onRetry,
              icon: const Icon(Icons.refresh),
              label: const Text('Retry'),
            ),"""
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(
                      "SAFE PATCH FAILED: expected Dashboard code was not found."
                  )

          for old, new in replacements:
              text = text.replace(old, new, 1)

          path.write_text(text)

          print("Dashboard Issue #3 patch completed successfully.")
          PY

      - name: Format Dashboard
        working-directory: assetflow_mobile
        run: |
          dart format lib/screens/dashboard/dashboard_screen.dart

      # -------------------------------------------------------
      # Verify #1/#2 API code
      # -------------------------------------------------------

      - name: Verify API client unchanged
        run: |
          set -e

          sha256sum -c /tmp/api_client.sha256

          echo "API client is unchanged."

      # -------------------------------------------------------
      # Generate missing Flutter platform files
      #
      # IMPORTANT:
      # The repository currently contains no android/ directory.
      # flutter create --platforms=android creates only the
      # missing Android wrapper and does not replace lib/.
      # -------------------------------------------------------

      - name: Generate Android project
        working-directory: assetflow_mobile
        run: |
          set -e

          if [ -d android ]; then
            echo "Android directory already exists."
          else
            echo "Android directory is missing."
            echo "Generating Android platform project..."

            flutter create \
              --platforms=android \
              --project-name=assetflow_mobile \
              .

            echo "Android project generated."
          fi

          test -d android
          test -f android/app/build.gradle.kts || \
          test -f android/app/build.gradle

          echo "Android project verified."

      # -------------------------------------------------------
      # Dependencies
      # -------------------------------------------------------

      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: |
          flutter pub get

      # -------------------------------------------------------
      # Restore files modified by Flutter
      # -------------------------------------------------------

      - name: Restore protected project files
        run: |
          set -e

          cp /tmp/analysis_options.yaml \
            assetflow_mobile/analysis_options.yaml

          if [ -f /tmp/pubspec.lock ]; then
            cp /tmp/pubspec.lock \
              assetflow_mobile/pubspec.lock
          else
            rm -f assetflow_mobile/pubspec.lock
          fi

          echo "Protected project files restored."

      # -------------------------------------------------------
      # Analyze
      # -------------------------------------------------------

      - name: Flutter analyze
        working-directory: assetflow_mobile
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # -------------------------------------------------------
      # Tests
      # -------------------------------------------------------

      - name: Flutter tests
        working-directory: assetflow_mobile
        run: |
          if [ -d "test" ] && \
             find test -type f -name "*_test.dart" | grep -q .; then

            echo "Flutter test suite found."
            flutter test

          else

            echo "No Flutter test suite found."
            echo "Skipping flutter test."

          fi

      # -------------------------------------------------------
      # Build production APK
      # -------------------------------------------------------

      - name: Flutter clean
        working-directory: assetflow_mobile
        run: |
          flutter clean

      - name: Flutter pub get after clean
        working-directory: assetflow_mobile
        run: |
          flutter pub get

      - name: Build production APK
        working-directory: assetflow_mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      # -------------------------------------------------------
      # Verify APK
      # -------------------------------------------------------

      - name: Verify APK
        run: |
          set -e

          APK="assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "APK successfully created."
          echo "APK size: $SIZE bytes."

      # -------------------------------------------------------
      # Upload APK
      # -------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-Dashboard-Issue3
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # -------------------------------------------------------
      # Final API safety check
      # -------------------------------------------------------

      - name: Final API safety check
        run: |
          set -e

          sha256sum -c /tmp/api_client.sha256

          echo "API client remains unchanged."

      # -------------------------------------------------------
      # Commit only intentional application changes
      # -------------------------------------------------------

      - name: Commit Dashboard and Android project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assetflow_mobile/lib/screens/dashboard/dashboard_screen.dart \
            assetflow_mobile/android

          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "fix(assetflow): add dashboard retry and Android project"

          git push origin HEAD:master

          echo "Dashboard fix and Android project committed successfully."
