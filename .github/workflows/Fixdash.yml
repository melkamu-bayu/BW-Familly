      - name: Save API client checksum
        working-directory: assetflow_mobile
        run: |
          set -e
          sha256sum lib/core/api_client.dart | awk '{print $1}' > /tmp/api_client_before.sha256

      # ... Dashboard changes happen here ...

      - name: Verify API client unchanged
        working-directory: assetflow_mobile
        run: |
          set -e

          BEFORE=$(cat /tmp/api_client_before.sha256)
          AFTER=$(sha256sum lib/core/api_client.dart | awk '{print $1}')

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ERROR: api_client.dart was modified."
            exit 1
          fi

          echo "API client unchanged."
