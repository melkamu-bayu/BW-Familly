name: Extract AssetFlow New UI ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          set -e

          echo "Checking ZIP..."

          if [ ! -f "AssetFlow_mobile_final_home_ui.zip" ]; then
            echo "ERROR: AssetFlow_mobile_final_home_ui.zip not found."
            exit 1
          fi

          echo "ZIP found:"
          ls -lh AssetFlow_mobile_final_home_ui.zip

          echo ""
          echo "Extracting..."

          rm -rf extracted_assetflow_ui
          mkdir -p extracted_assetflow_ui

          unzip -q \
            AssetFlow_mobile_final_home_ui.zip \
            -d extracted_assetflow_ui

          echo ""
          echo "Extraction completed successfully."

          echo ""
          echo "Extracted files:"
          find extracted_assetflow_ui -type f | sort

      - name: Upload extracted project
        uses: actions/upload-artifact@v5
        with:
          name: AssetFlow-New-UI-Extracted
          path: extracted_assetflow_ui
          if-no-files-found: error
