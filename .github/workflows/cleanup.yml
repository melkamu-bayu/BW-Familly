name: Repo Cleanup
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove tracked __pycache__ and .pyc files
        run: |
          find . -type d -name "__pycache__" -not -path "./.git/*" -exec git rm -r --cached -q {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -not -path "./.git/*" -exec git rm --cached -q {} + 2>/dev/null || true
          find . -type d -name "__pycache__" -not -path "./.git/*" -exec rm -rf {} + 2>/dev/null || true

      - name: Add .gitignore to assetflow-backend (if missing)
        run: |
          if [ ! -f assetflow-backend/.gitignore ]; then
            cat > assetflow-backend/.gitignore << 'EOF'
          __pycache__/
          *.pyc
          *.pyo
          .pytest_cache/
          .venv/
          venv/
          .env
          *.egg-info/
          .DS_Store
          EOF
          fi

      - name: Restore README.md at repo root
        run: |
          if [ ! -f README.md ] && [ -f README.md.from-bwfamily ]; then
            mv README.md.from-bwfamily README.md
          elif [ -f README.md.from-bwfamily ]; then
            # Both exist -- don't guess which content wins, just say so in the log.
            echo "Both README.md and README.md.from-bwfamily exist -- leaving both for manual merge."
          fi

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Cleanup: untrack __pycache__, add backend .gitignore, restore README.md" || echo "No changes"
          git push
