name: AssetFlow Login Page Update

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: assetflow_mobile
  FLUTTER_VERSION: "3.35.7"
  API_BASE_URL: "https://assetflow-api-f435.onrender.com/api/v1"

jobs:
  build:
    name: Build AssetFlow Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. FLUTTER
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ==========================================================
      # 3. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. VERIFY ASSETFLOW PROJECT
      # ==========================================================
      - name: Verify AssetFlow project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFYING ASSETFLOW PROJECT"
          echo "======================================"

          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          test -f lib/screens/auth/login_screen.dart
          test -f assets/assetflow_logo.png

          echo "Project directory:"
          pwd

          echo "Flutter:"
          flutter --version

          echo "Login screen:"
          ls -lh lib/screens/auth/login_screen.dart

          echo "AssetFlow logo:"
          ls -lh assets/assetflow_logo.png

          echo "Project verification successful."

      # ==========================================================
      # 5. GENERATE ANDROID PROJECT
      #
      # The repository needs the Android build structure.
      # Flutter creates it without replacing the AssetFlow app code.
      # ==========================================================
      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "GENERATING ANDROID PROJECT"
          echo "======================================"

          flutter create \
            --platforms=android \
            --project-name assetflow_mobile \
            .

          test -d android
          test -f android/gradle/wrapper/gradle-wrapper.properties

          if [ -f android/app/build.gradle.kts ]; then
            echo "Found Android Kotlin Gradle configuration."
          elif [ -f android/app/build.gradle ]; then
            echo "Found Android Gradle configuration."
          else
            echo "ERROR: Android Gradle configuration not found."
            exit 1
          fi

          echo "Android project generated successfully."

      # ==========================================================
      # 6. REMOVE FLUTTER GENERATED DEFAULT TEST
      #
      # flutter create generates test/widget_test.dart containing
      # MyApp(). AssetFlow uses AssetFlowApp, so this default test
      # is not part of the real application.
      # ==========================================================
      - name: Remove generated Flutter test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f test/widget_test.dart ]; then
            rm -f test/widget_test.dart
            echo "Removed generated test/widget_test.dart"
          else
            echo "No generated widget test found."
          fi

          # Remove empty test directory if it is now empty.
          if [ -d test ] && [ -z "$(find test -type f -print -quit)" ]; then
            rmdir test || true
          fi

      # ==========================================================
      # 7. VERIFY LOGIN PAGE + LOGO
      # ==========================================================
      - name: Verify AssetFlow login page
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFYING LOGIN PAGE"
          echo "======================================"

          test -f lib/screens/auth/login_screen.dart
          test -f assets/assetflow_logo.png

          grep -q "assets/assetflow_logo.png" \
            lib/screens/auth/login_screen.dart

          grep -q "assets/" pubspec.yaml

          echo "Login page found."
          echo "AssetFlow logo found."
          echo "Login page logo reference verified."

      # ==========================================================
      # 8. FORMAT LOGIN PAGE
      # ==========================================================
      - name: Format login page
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          dart format lib/screens/auth/login_screen.dart

          echo "Login page formatted successfully."

      # ==========================================================
      # 9. CLEAN
      # ==========================================================
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter clean

      # ==========================================================
      # 10. GET DEPENDENCIES
      # ==========================================================
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      # ==========================================================
      # 11. ANALYZE REAL APPLICATION CODE
      #
      # IMPORTANT:
      # Analyze lib only.
      #
      # This prevents an automatically generated Flutter test from
      # breaking the production APK build.
      #
      # Real compile errors in lib still fail the workflow.
      # ==========================================================
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ANALYZING ASSETFLOW LIB"
          echo "======================================"

          flutter analyze lib \
            --no-fatal-infos \
            --no-fatal-warnings

          echo "Flutter analysis completed."

      # ==========================================================
      # 12. BUILD RELEASE APK
      #
      # No Render health check is performed here.
      #
      # Render cold-start/network availability must NOT prevent
      # the APK from being compiled.
      #
      # API_BASE_URL is embedded into the application at build time.
      # ==========================================================
      - name: Build AssetFlow Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING ASSETFLOW RELEASE APK"
          echo "======================================"

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

          echo "APK build completed."

      # ==========================================================
      # 13. VERIFY APK
      # ==========================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "======================================"
          echo "VERIFYING APK"
          echo "======================================"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "APK exists."
          echo "APK size: $SIZE bytes"
          ls -lh "$APK"

      # ==========================================================
      # 14. UPLOAD APK
      # ==========================================================
      - name: Upload AssetFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ==========================================================
      # 15. COMMIT GENERATED ANDROID PROJECT
      #
      # This makes the generated Android project permanent in GitHub
      # so future workflows don't have to recreate it.
      # ==========================================================
      - name: Commit Android project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow_mobile/android

          if git diff --cached --quiet; then
            echo "No Android project changes to commit."
          else
            git commit -m "Add Android build project for AssetFlow"
            git push
            echo "Android project committed successfully."
          fi
