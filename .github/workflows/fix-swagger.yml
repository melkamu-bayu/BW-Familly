name: Fix Swagger OAuth2 Authentication

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-swagger-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fix OAuth2 token URL
        run: |
          python <<'PY'
          from pathlib import Path

          file = Path("assetflow-backend/app/core/dependencies.py")
          text = file.read_text()

          old = 'OAuth2PasswordBearer(tokenUrl="/api/v1/auth/login")'
          new = 'OAuth2PasswordBearer(tokenUrl="/api/v1/auth/token")'

          if old not in text:
              raise SystemExit(
                  "Expected OAuth2PasswordBearer login URL was not found."
              )

          file.write_text(text.replace(old, new))
          print("OAuth2 token URL updated successfully.")
          PY

      - name: Add OAuth2 token endpoint
        run: |
          python <<'PY'
          from pathlib import Path

          file = Path("assetflow-backend/app/api/v1/auth.py")
          text = file.read_text()

          if "from fastapi.security import OAuth2PasswordRequestForm" not in text:
              text = text.replace(
                  "from fastapi import",
                  "from fastapi.security import OAuth2PasswordRequestForm\nfrom fastapi import",
                  1
              )

          endpoint = '''

          @router.post("/token", response_model=TokenResponse)
          def token(
              form_data: OAuth2PasswordRequestForm = Depends(),
              db: Session = Depends(get_db),
          ):
              login_data = LoginRequest(
                  email=form_data.username,
                  password=form_data.password,
              )

              return login(login_data, db)
          '''

          if '@router.post("/token"' not in text:
              text += endpoint

          file.write_text(text)
          print("OAuth2 token endpoint added successfully.")
          PY

      - name: Check changes
        run: |
          git diff -- assetflow-backend/app/core/dependencies.py
          git diff -- assetflow-backend/app/api/v1/auth.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assetflow-backend/app/core/dependencies.py
          git add assetflow-backend/app/api/v1/auth.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix Swagger OAuth2 authentication"
          git push
