name: AssetFlow Mobile - Production APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Production APK
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 3. FLUTTER
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ==========================================================
      # 4. VERIFY FLUTTER PROJECT
      # ==========================================================
      - name: Verify Flutter project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "Flutter project verified."

      # ==========================================================
      # 5. CHECK PRODUCTION API
      # ==========================================================
      - name: Check production API
        run: |
          set -euo pipefail

          API_URL="https://assetflow-api-f435.onrender.com/docs"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 60 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$API_URL"
          )"

          echo "Production API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Production API is not reachable."
            exit 1
          fi

      # ==========================================================
      # 6. GENERATE CLEAN ANDROID PROJECT
      # ==========================================================
      - name: Generate Android project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          echo "Removing incomplete Android project..."
          rm -rf android

          echo "Generating Android platform..."

          flutter create \
            --platforms=android \
            --project-name=assetflow_mobile \
            --org=com.bwfamily \
            .

          echo "Android project generated."

      # ==========================================================
      # 7. VERIFY GRADLE
      # ==========================================================
      - name: Verify Android Gradle project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          test -d android
          test -d android/app

          if [ -f android/app/build.gradle.kts ]; then
            echo "Found android/app/build.gradle.kts"
          elif [ -f android/app/build.gradle ]; then
            echo "Found android/app/build.gradle"
          else
            echo "ERROR: Android Gradle build file missing."

            find android -maxdepth 4 -type f | sort

            exit 1
          fi

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android Gradle project verified."

      # ==========================================================
      # 8. INTERNET PERMISSION
      # ==========================================================
      - name: Configure INTERNET permission
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if permission not in text:
              start = text.find("<manifest")

              if start == -1:
                  raise SystemExit(
                      "ERROR: <manifest> tag not found."
                  )

              end = text.find(">", start)

              if end == -1:
                  raise SystemExit(
                      "ERROR: Invalid AndroidManifest.xml."
                  )

              text = (
                  text[:end + 1]
                  + "\n    "
                  + permission
                  + "\n"
                  + text[end + 1:]
              )

              path.write_text(text)

          if permission not in path.read_text():
              raise SystemExit(
                  "ERROR: INTERNET permission missing."
              )

          print("INTERNET permission verified.")
          PY

      # ==========================================================
      # 9. VERIFY API CONFIG
      # ==========================================================
      - name: Verify production API configuration
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          grep -F \
            "https://assetflow-api-f435.onrender.com/api/v1" \
            lib/core/config.dart

          echo "Production API configuration verified."

      # ==========================================================
      # 10. FLUTTER CLEAN
      # ==========================================================
      - name: Flutter clean
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter clean

      # ==========================================================
      # 11. GET DEPENDENCIES
      # ==========================================================
      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter pub get

      # ==========================================================
      # 12. ANALYZE
      # ==========================================================
      - name: Flutter analyze
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter analyze

      # ==========================================================
      # 13. BUILD RELEASE APK
      # ==========================================================
      - name: Build release APK
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      # ==========================================================
      # 14. VERIFY APK
      # ==========================================================
      - name: Verify APK
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo ""
          echo "========================================"
          echo " ASSETFLOW APK BUILD SUCCESS"
          echo "========================================"

          ls -lh "$APK"

      # ==========================================================
      # 15. UPLOAD APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-production-release
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
