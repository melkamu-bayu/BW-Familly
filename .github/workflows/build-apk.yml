name: Build AssetFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        id: find_project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -not -path './.git/*' | head -1)")
          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "Flutter project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Regenerate Android project
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          flutter create .

      - name: Get dependencies
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assetflow-release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
