name: AssetFlow APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AssetFlow Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assetflow_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml
          echo "Flutter project found."
          echo "Project directory: $(pwd)"

      - name: Prepare modern Android project
        shell: bash
        run: |
          set -e

          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            echo "Android project is missing or unsupported."
            echo "Generating a modern Flutter Android project..."

            TMP_DIR="$(mktemp -d)"

            flutter create \
              --platforms=android \
              --org com.assetflow \
              "$TMP_DIR/assetflow"

            rm -rf android
            cp -a "$TMP_DIR/assetflow/android" ./android

            rm -rf "$TMP_DIR"
          fi

          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

          echo "Android project is ready."

      - name: Configure Android Internet permission
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\
              <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          echo "Internet permission verified."

      - name: Get dependencies
        run: flutter pub get

      - name: Check Flutter project
        run: |
          flutter pub deps --style=compact > /dev/null
          echo "Dependencies resolved successfully."

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-apk
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
