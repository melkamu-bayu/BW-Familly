name: AssetFlow Mobile - Production APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AssetFlow Production APK
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      # ============================================================
      # 4. VERIFY PROJECT
      # ============================================================
      - name: Verify Flutter project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/models/models.dart
          test -f lib/screens/dashboard/dashboard_screen.dart

          echo "Flutter project verified."

      # ============================================================
      # 5. VERIFY APPLICATION ENTRY POINT
      # ============================================================
      - name: Verify application entry point
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          grep -q "class AssetFlowApp" lib/main.dart
          grep -q "runApp" lib/main.dart

          echo "AssetFlowApp verified."

      # ============================================================
      # 6. VERIFY PRODUCTION API
      # ============================================================
      - name: Check production API
        run: |
          set -euo pipefail

          URL="https://assetflow-api-f435.onrender.com/docs"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 60 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$URL"
          )"

          echo "Production API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Production API check failed."
            exit 1
          fi

          echo "Production API is reachable."

      # ============================================================
      # 7. GENERATE CLEAN ANDROID PROJECT
      # ============================================================
      - name: Generate Android project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name=assetflow_mobile \
            --org=com.bwfamily \
            .

          echo "Android project generated."

      # ============================================================
      # 8. VERIFY ANDROID / GRADLE
      # ============================================================
      - name: Verify Android Gradle project
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          test -d android
          test -d android/app
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml

          if [ -f android/app/build.gradle.kts ]; then
            echo "Found build.gradle.kts"
          elif [ -f android/app/build.gradle ]; then
            echo "Found build.gradle"
          else
            echo "ERROR: Android Gradle build file missing."
            exit 1
          fi

          echo "Android Gradle project verified."

      # ============================================================
      # 9. INTERNET PERMISSION
      # ============================================================
      - name: Configure INTERNET permission
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if permission not in text:
              manifest_start = text.find("<manifest")

              if manifest_start == -1:
                  raise SystemExit(
                      "ERROR: <manifest> tag not found."
                  )

              manifest_end = text.find(">", manifest_start)

              if manifest_end == -1:
                  raise SystemExit(
                      "ERROR: invalid AndroidManifest.xml."
                  )

              text = (
                  text[:manifest_end + 1]
                  + "\n    "
                  + permission
                  + "\n"
                  + text[manifest_end + 1:]
              )

              path.write_text(text)

          if permission not in path.read_text():
              raise SystemExit(
                  "ERROR: INTERNET permission missing."
              )

          echo = "INTERNET permission verified."
          print(echo)
          PY

      # ============================================================
      # 10. CLEAN
      # ============================================================
      - name: Flutter clean
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter clean

      # ============================================================
      # 11. GET DEPENDENCIES
      # ============================================================
      - name: Flutter pub get
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter pub get

      # ============================================================
      # 12. ANALYZE
      #
      # IMPORTANT:
      # Existing project has deprecated_member_use,
      # unused_import, async-gap, const and similar diagnostics.
      #
      # These are NOT compilation errors.
      #
      # Real compiler errors will still stop flutter build apk.
      # ============================================================
      - name: Flutter analyze
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          echo "Running Flutter analyzer..."

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

          echo "Flutter analyzer completed."

      # ============================================================
      # 13. VERIFY NO KNOWN INVALID VEHICLE FIELDS
      # ============================================================
      - name: Verify Vehicle model compatibility
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          if grep -R -nE \
            'v\.currentValue|v\.purchasePrice' \
            lib; then

            echo ""
            echo "ERROR: Invalid Vehicle fields detected."
            echo "Vehicle does not define currentValue or purchasePrice."
            exit 1
          fi

          echo "Vehicle model compatibility verified."

      # ============================================================
      # 14. BUILD RELEASE APK
      #
      # THIS is the real production compilation gate.
      #
      # If Dart/Flutter/Gradle has an actual compile error,
      # this step WILL FAIL.
      # ============================================================
      - name: Build release APK
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      # ============================================================
      # 15. VERIFY APK
      # ============================================================
      - name: Verify APK
        working-directory: assetflow_mobile
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            find build \
              -type f \
              -print \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            echo "Size: $SIZE bytes"
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "      ASSETFLOW APK BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "APK:"
          echo "$APK"
          echo ""
          ls -lh "$APK"

      # ============================================================
      # 16. UPLOAD APK
      # ============================================================
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-production-release
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
