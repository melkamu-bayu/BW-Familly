name: Build AssetFlow Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AssetFlow APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project
        run: |
          set -e

          if [ -f "assetflow_mobile/pubspec.yaml" ]; then
            echo "Flutter project found at assetflow_mobile"
          else
            echo "ERROR: assetflow_mobile/pubspec.yaml not found"
            find . -maxdepth 3 -name pubspec.yaml -print
            exit 1
          fi

      - name: Verify Flutter project
        run: |
          set -e
          cd assetflow_mobile

          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "Flutter project verified."
          flutter --version

      - name: Get dependencies
        run: |
          set -e
          cd assetflow_mobile
          flutter pub get

      - name: Fix Vehicle compile error
        run: |
          set -e
          cd assetflow_mobile

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/screens/dashboard/dashboard_screen.dart")
          text = path.read_text()

          old = "v.currentValue ?? v.purchasePrice ?? 0"

          if old in text:
              text = text.replace(old, "0")
              path.write_text(text)
              print("Vehicle compile error fixed.")
          else:
              print("Vehicle expression already fixed.")

          if "v.currentValue" in text:
              raise SystemExit("ERROR: currentValue still exists")

          if "v.purchasePrice" in text:
              raise SystemExit("ERROR: purchasePrice still exists")
          PY

      - name: Verify AssetFlow logo
        run: |
          set -e
          cd assetflow_mobile

          if [ ! -f "assets/assetflow_logo.png" ]; then
            echo "ERROR: AssetFlow logo not found."
            exit 1
          fi

          echo "AssetFlow logo found."

      - name: Configure APK icon
        run: |
          set -e
          cd assetflow_mobile

          flutter pub add --dev flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/assetflow_logo.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/assetflow_logo.png"
          EOF

          flutter pub get

      - name: Generate APK icon
        run: |
          set -e
          cd assetflow_mobile

          dart run flutter_launcher_icons

      - name: Verify Android project
        run: |
          set -e
          cd assetflow_mobile

          test -f android/gradlew

          if [ -f android/app/build.gradle ]; then
            echo "Android Gradle project verified."
          elif [ -f android/app/build.gradle.kts ]; then
            echo "Android Gradle Kotlin project verified."
          else
            echo "ERROR: Android Gradle configuration not found."
            exit 1
          fi

      - name: Clean
        run: |
          cd assetflow_mobile
          flutter clean

      - name: Get dependencies after clean
        run: |
          cd assetflow_mobile
          flutter pub get

      - name: Build release APK
        run: |
          set -e
          cd assetflow_mobile

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://assetflow-api-f435.onrender.com/api/v1

      - name: Verify APK
        run: |
          set -e

          APK="assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "=========================================="
          echo "ASSETFLOW APK BUILD SUCCESSFUL"
          echo "=========================================="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release-APK
          path: assetflow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
