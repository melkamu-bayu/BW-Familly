name: assetflow_mobile
description: AssetFlow - Real-Time Business, Revenue & Expense Management System
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0

  # Local persistence (offline-first cache + outbox)
  sqflite: ^2.3.3
  path: ^1.9.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Biometric / PIN unlock
  local_auth: ^2.3.0

  # Charts (trend/analytics screens)
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

  # Connectivity detection for the sync engine
  connectivity_plus: ^6.0.5

  # Unique client-side IDs for idempotency keys
  uuid: ^4.4.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
